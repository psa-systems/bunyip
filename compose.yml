---
# Bunyip (PSA Systems) - production / self-host reference deployment.
#
# Runs the published OCI images (no build-from-source) plus PostgreSQL. For
# local development use compose.dev.yml instead (via `just dev`); this file is
# what an operator or self-hosting MSP deploys.
#
# Quick start:
#   1. cp .env.example .env  and fill in the production values (POSTGRES_PASSWORD,
#      JWT_SECRET, the OIDC keys under ./secrets, BUNYIP_API_URL, etc.).
#   2. docker login dev.a8n.run   (the images live in the private registry).
#   3. docker compose up --detach
#
# Applying an update is a deliberate operator action:
#   docker compose pull && docker compose up --detach
#
# Resource naming follows the governance convention: bunyip-{service} for
# containers/volumes/network (no dev- prefix in production).
name: bunyip

services:

  # PostgreSQL database. The api runs migrations against it on startup.
  postgres:
    image: postgres:16-alpine
    container_name: bunyip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunyip}
      # Set a strong value in .env for any real deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-bunyip}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username ${POSTGRES_USER:-bunyip} --dbname ${POSTGRES_DB:-bunyip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - private

  # actix-web backend (bunyip-api). Published musl-static image; binds on
  # HOST_IP:APP_PORT inside the container and IS the OIDC issuer (Ed25519 keys
  # mounted from ./secrets).
  api:
    image: ${BUNYIP_API_IMAGE:-dev.a8n.run/psa-systems-private/bunyip-api:latest}
    container_name: bunyip-api
    restart: unless-stopped
    environment:
      SQLX_OFFLINE: "true"
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-bunyip}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-bunyip}}
      HOST_IP: 0.0.0.0
      APP_PORT: "4401"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: ${APP_NAME:-PSA Systems}
      # Set to the public bunyip-web origin for any real deployment.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4400}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Generate 32+ random chars for any real deployment.
      JWT_SECRET: ${JWT_SECRET:-changeme-set-a-real-32char-jwt-secret-000000}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      STRIPE_ENCRYPTION_KEY: ${STRIPE_ENCRYPTION_KEY:-}
      SETUP_DEFAULT_ADMIN: ${SETUP_DEFAULT_ADMIN:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWT_PRIVATE_KEY_PATH: /run/secrets/oidc/dev-2026.pem
      OIDC_JWT_ACTIVE_KID: ${OIDC_JWT_ACTIVE_KID:-dev-2026}
      OIDC_JWT_PUBLIC_KEYS_DIR: /run/secrets/oidc
    expose:
      - "4401"
    ports:
      - "${HOST_IP:-127.0.0.1}:${BUNYIP_API_PORT:-4401}:4401"
    volumes:
      - ./secrets:/run/secrets/oidc:ro
      # NOTE for the distribution proxy (BUNYIP-32): when the OCI registry and
      # download proxy are enabled here, their caches MUST be NAMED volumes
      # mounted at /var/cache/bunyip-oci and /var/cache/bunyip-downloads
      # (e.g. `oci-cache:/var/cache/bunyip-oci`). The image pre-creates those
      # paths owned by the runtime user, and named volumes inherit that
      # ownership on first use. A host bind-mount does NOT inherit it and
      # mounts root-owned, which breaks every blob/asset write (Permission
      # denied -> 502 on all pulls). If you must bind-mount, chown the host
      # directory to the container user first.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # Axum SSR frontend (bunyip-web). Published image; reaches the api over the
  # internal network and serves the browser-facing pages + /assets.
  web:
    image: ${BUNYIP_WEB_IMAGE:-dev.a8n.run/psa-systems-private/bunyip-web:latest}
    container_name: bunyip-web
    restart: unless-stopped
    environment:
      BUNYIP_BIND_ADDR: 0.0.0.0:4400
      BUNYIP_API_URL: ${BUNYIP_API_URL:-http://api:4401}
      BUNYIP_OIDC_ISSUER: ${BUNYIP_OIDC_ISSUER:-}
      BUNYIP_APP_DOMAIN: ${BUNYIP_APP_DOMAIN:-}
      BUNYIP_SHOW_BUSINESS_PRICING: ${BUNYIP_SHOW_BUSINESS_PRICING:-false}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "4400"
    ports:
      - "${HOST_IP:-127.0.0.1}:${BUNYIP_WEB_PORT:-4400}:4400"
    depends_on:
      - api
    networks:
      - private


volumes:
  postgres-data:
    name: bunyip-postgres-data

networks:
  private:
    name: bunyip-private
    driver: bridge
