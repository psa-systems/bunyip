---
# Bunyip (PSA Systems) - production / self-host reference deployment.
#
# Runs the published OCI images (no build-from-source) plus PostgreSQL. For
# local development use compose.dev.yml instead (via `just dev`); this file is
# what an operator or self-hosting MSP deploys.
#
# Quick start:
#   1. cp .env.example .env  and fill in the production values (CORS_ORIGIN,
#      BUNYIP_API_URL, OIDC_ISSUER, etc. - non-secret config only).
#   2. ./scripts/init-secrets.sh
#      Creates every secret file under ./secrets/ (generating strong values
#      where needed) plus the OIDC signing keys under ./secrets/oidc/. The
#      script is idempotent and never overwrites existing values.
#   3. docker login dev.a8n.run   (the images live in the private registry).
#   4. docker compose up --detach
#
# Upgrading an EXISTING deployment that used .env-based secrets (pre-BUNYIP-38):
#   run ./scripts/init-secrets.sh BEFORE `docker compose up`. It migrates the
#   secret values out of your existing .env into the secret files; without
#   this step compose aborts because the secret files do not exist.
#
# Applying an update is a deliberate operator action:
#   docker compose pull && docker compose up --detach
#
# Secrets are file-based (compose `secrets:` mounted under /run/secrets/*),
# never plain environment variables, so `docker inspect` and /proc/<pid>/environ
# never expose them (BUNYIP-38). The api reads each one via the {NAME}_FILE
# convention with a fallback to {NAME} env vars for dev. Every secret file must
# exist before compose starts; an EMPTY file means "not configured" (feature
# off) for every secret except postgres_password and database_url, which must
# be non-empty (postgres refuses to initialize with an empty password).
#
# Resource naming follows the governance convention: bunyip-{service} for
# containers/volumes/network (no dev- prefix in production).
name: bunyip

# File-based secrets, one value per file under ./secrets (gitignored).
# ./scripts/init-secrets.sh creates all of them; see the header note above for
# which ones may be left empty.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  # BUNYIP-360: the unprivileged NOBYPASSRLS `bunyip_app` role that activates
  # per-user RLS. bunyip_app_password is set on the role at startup; the
  # password embedded in app_database_url must match it. Omit both to keep RLS
  # inactive (the app pool falls back to the primary pool).
  bunyip_app_password:
    file: ./secrets/bunyip_app_password
  app_database_url:
    file: ./secrets/app_database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  # BUNYIP-483: the ONE at-rest AES-256-GCM key, protecting the TOTP secrets
  # (user_totp), the Stripe credentials (stripe_config) and the SMTP password
  # (email_config). The Stripe API keys themselves are NOT secret files: they
  # live only in the stripe_config DB row, entered on the admin Stripe page
  # (BUNYIP-482).
  app_encryption_key:
    file: ./secrets/app_encryption_key
  setup_default_admin:
    file: ./secrets/setup_default_admin
  forgejo_api_token:
    file: ./secrets/forgejo_api_token
  smtp_password:
    file: ./secrets/smtp_password
  update_check_token:
    file: ./secrets/update_check_token

services:

  # PostgreSQL database. The api runs migrations against it on startup.
  postgres:
    # Postgres 18, matching the deployed infra template
    # (template/bunyip-api/compose.yml pins postgres:18.2-alpine3.23). BUNYIP-350.
    image: postgres:18.2-alpine3.23
    container_name: bunyip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunyip}
      # Native postgres-image file-secret support; the password never appears
      # in `docker inspect`.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-bunyip}
    secrets:
      - postgres_password
    expose:
      - "5432"
    volumes:
      # Mount the whole tree (not .../data): Postgres >= 18 defaults PGDATA to
      # /var/lib/postgresql/<MAJOR>/docker, so the volume must cover the parent
      # to persist across the 16 -> 18 layout change (BUNYIP-350). Mirrors the
      # deployed template.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username ${POSTGRES_USER:-bunyip} --dbname ${POSTGRES_DB:-bunyip}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - private

  # actix-web backend (bunyip-api). Published musl-static image; binds on
  # HOST_IP:APP_PORT inside the container and IS the OIDC issuer (Ed25519 keys
  # mounted from ./secrets/oidc).
  api:
    # BUNYIP-237: BUNYIP_API_IMAGE must be set explicitly to a pinned tag
    # (e.g. `dev.a8n.run/psa-systems-private/bunyip-api:v0.4.1`). The
    # previous default of `:latest` plus `pull_policy: always` resolves the
    # tag at restart time, so two restarts seconds apart can pull two
    # different digests and the LB serves mixed builds. Fail loud at
    # `compose up` when the var is missing instead of silently pulling
    # `:latest`. The `:?<message>` form is the docker-compose required-var
    # marker; the message is printed alongside the abort.
    image: ${BUNYIP_API_IMAGE:?BUNYIP_API_IMAGE must be a pinned image tag e.g. dev.a8n.run/psa-systems-private/bunyip-api:v0.4.1 - see compose.yml comment}
    container_name: bunyip-api
    restart: unless-stopped
    environment:
      # Secrets are file-based: each {NAME}_FILE points at a compose secret
      # mounted under /run/secrets. The api's config layer reads the file and
      # treats an empty file as "not configured" (BUNYIP-38).
      DATABASE_URL_FILE: /run/secrets/database_url
      # BUNYIP-360: per-user RLS. BUNYIP_APP_PASSWORD provisions the bunyip_app
      # role at startup; APP_DATABASE_URL connects the self-service pool as it.
      # An empty secret file = "not configured", so RLS stays inactive until
      # both files are populated (see the secrets: block header).
      BUNYIP_APP_PASSWORD_FILE: /run/secrets/bunyip_app_password
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
      # Comma-separated hex keys still needed to read rows written under an
      # earlier key (rotation, or the BUNYIP-483 consolidation window). Empty
      # once `bunyip-api reencrypt-secrets` has run. Honours the _FILE
      # convention too, if the list is kept in a secret file.
      APP_ENCRYPTION_KEY_PREV: ${APP_ENCRYPTION_KEY_PREV:-}
      SETUP_DEFAULT_ADMIN_FILE: /run/secrets/setup_default_admin
      FORGEJO_API_TOKEN_FILE: /run/secrets/forgejo_api_token
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      BUNYIP_UPDATE_CHECK_TOKEN_FILE: /run/secrets/update_check_token
      HOST_IP: 0.0.0.0
      APP_PORT: "4401"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: ${APP_NAME:-PSA Systems}
      # BUNYIP-290: bootstrap the first admin from an email (no password in env).
      # Whoever signs up / signs in with this email is promoted to admin while
      # zero admins exist; inert once an admin exists. Unset = no auto admin.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Set to the public bunyip-web origin for any real deployment.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4400}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # BUNYIP-311 / BUNYIP-409: trusted-proxy CIDRs for the SECOND hop of the
      # client-IP trust chain (Traefik -> bunyip-web -> bunyip-api). bunyip-api
      # honours a forwarded X-Forwarded-For only from a peer inside these ranges,
      # so this MUST include bunyip-web's address on the `bunyip-private` network
      # (so SSR-proxied /v1 calls surface the end-user IP, e.g. on the Active
      # Sessions list) plus the edge proxy's address (SSE, OIDC, external RPs).
      # Defaults to the RFC1918 private ranges: bunyip-api is only reachable over
      # the internal Docker network + Traefik, so the only peers are trusted
      # infra, and an empty value left session/audit IPs stuck on the internal
      # Docker peer (BUNYIP-409). Override for a topology where the API is
      # reachable from an untrusted private network. See docs/client-ip-forwarding.md.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      RUST_LOG: ${RUST_LOG:-info}
      # ── Email (SMTP). Password comes from the smtp_password secret above. ──
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_TLS: ${SMTP_TLS:-implicit}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
      # ── Update checker (operator-facing). Token via update_check_token secret. ──
      BUNYIP_UPDATE_CHECK_URL: ${BUNYIP_UPDATE_CHECK_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      # BUNYIP-258: no defaults for OIDC signing key path / active kid. The
      # previous defaults (`/run/secrets/oidc/dev-2026.pem`, `dev-2026`)
      # silently signed prod tokens with a dev-named kid when a deploy
      # forgot to override them - downstream RPs would have happily
      # consumed `kid=dev-2026` tokens because their JWKS lookup is keyed
      # on whatever the OP advertises. Fail loud at `compose up` instead.
      # Mirrors the BUNYIP-237 posture for image pins.
      OIDC_JWT_PRIVATE_KEY_PATH: ${OIDC_JWT_PRIVATE_KEY_PATH:?OIDC_JWT_PRIVATE_KEY_PATH must be set to the production signing-key path (e.g. /run/secrets/oidc/prod-2026.pem) - no dev default}
      OIDC_JWT_ACTIVE_KID: ${OIDC_JWT_ACTIVE_KID:?OIDC_JWT_ACTIVE_KID must be set to the active kid name (e.g. prod-2026) - no dev default}
      OIDC_JWT_PUBLIC_KEYS_DIR: /run/secrets/oidc
      # ── Distribution proxy (member downloads + OCI registry, BUNYIP-28) ──
      # Disabled until FORGEJO_BASE_URL (.env) + the forgejo_api_token secret
      # file are set. Configuration rules, token scopes, and the reverse-proxy
      # requirements live in ONE place: docs/oci-registry-verification.md
      # (Production notes). Every ${VAR} below is documented in .env.example.
      FORGEJO_BASE_URL: ${FORGEJO_BASE_URL:-}
      DOWNLOAD_CACHE_DIR: /var/cache/bunyip-downloads
      DOWNLOAD_CACHE_MAX_BYTES: ${DOWNLOAD_CACHE_MAX_BYTES:-10737418240}
      OCI_REGISTRY_ENABLED: ${OCI_REGISTRY_ENABLED:-false}
      OCI_REGISTRY_PORT: "18081"
      # The public registry hostname behind the TLS reverse proxy. Required
      # when OCI_REGISTRY_ENABLED=true (startup fails fast if empty).
      OCI_REGISTRY_SERVICE: ${OCI_REGISTRY_SERVICE:-}
      OCI_BLOB_CACHE_DIR: /var/cache/bunyip-oci
      OCI_BLOB_CACHE_MAX_BYTES: ${OCI_BLOB_CACHE_MAX_BYTES:-53687091200}
      OCI_PULLS_PER_USER_PER_DAY: ${OCI_PULLS_PER_USER_PER_DAY:-50}
      DOWNLOAD_DAILY_LIMIT_PER_USER: ${DOWNLOAD_DAILY_LIMIT_PER_USER:-50}
      # Concurrency limits + cache TTLs (BUNYIP-42). Defaults mirror
      # crates/bunyip-domain/src/config.rs; override in .env to tune.
      DOWNLOAD_CONCURRENCY_PER_USER: ${DOWNLOAD_CONCURRENCY_PER_USER:-2}
      FORGEJO_RELEASE_CACHE_TTL_SECS: ${FORGEJO_RELEASE_CACHE_TTL_SECS:-300}
      OCI_CONCURRENT_MANIFESTS_PER_USER: ${OCI_CONCURRENT_MANIFESTS_PER_USER:-2}
      OCI_MANIFEST_CACHE_TTL_SECS: ${OCI_MANIFEST_CACHE_TTL_SECS:-300}
      OCI_TOKEN_TTL_SECS: ${OCI_TOKEN_TTL_SECS:-900}
    expose:
      - "4401"
      - "18081"
    ports:
      # NOTE: ${HOST_IP} here is the HOST-side publish interface (loopback by
      # default, for the reverse proxy to consume). It is a DIFFERENT setting
      # from the container env `HOST_IP: 0.0.0.0` above (the in-container bind
      # address). Do not set HOST_IP=0.0.0.0 in .env unless you intend to
      # publish these plaintext listeners on every host interface.
      - "${HOST_IP:-127.0.0.1}:${BUNYIP_API_PORT:-4401}:4401"
      - "${HOST_IP:-127.0.0.1}:${BUNYIP_OCI_PORT:-18081}:18081"
    secrets:
      - database_url
      - bunyip_app_password
      - app_database_url
      - jwt_secret
      - app_encryption_key
      - setup_default_admin
      - forgejo_api_token
      - smtp_password
      - update_check_token
    volumes:
      # OIDC signing keys only (a dedicated subdir, NOT the whole ./secrets
      # dir: the secret value files must never be visible at a second path
      # inside the container).
      - ./secrets/oidc:/run/secrets/oidc:ro
      # Distribution caches MUST be NAMED volumes, never host bind-mounts.
      # Why + the bind-mount workaround: docs/oci-registry-verification.md
      # (Production notes).
      - oci-cache:/var/cache/bunyip-oci
      - download-cache:/var/cache/bunyip-downloads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  # Axum SSR frontend (bunyip-web). Published image; reaches the api over the
  # internal network and serves the browser-facing pages + /assets.
  web:
    # BUNYIP-237: BUNYIP_WEB_IMAGE must be set explicitly to a pinned tag
    # (e.g. `dev.a8n.run/psa-systems-private/bunyip-web:v0.4.1`). See the
    # comment on the `api` service above for the rationale - same failure
    # mode (`:latest` + `pull_policy: always` resolving at restart time).
    image: ${BUNYIP_WEB_IMAGE:?BUNYIP_WEB_IMAGE must be a pinned image tag e.g. dev.a8n.run/psa-systems-private/bunyip-web:v0.4.1 - see compose.yml comment on api service}
    container_name: bunyip-web
    restart: unless-stopped
    environment:
      BUNYIP_BIND_ADDR: 0.0.0.0:4400
      BUNYIP_API_URL: ${BUNYIP_API_URL:-http://api:4401}
      BUNYIP_OIDC_ISSUER: ${BUNYIP_OIDC_ISSUER:-}
      BUNYIP_APP_DOMAIN: ${BUNYIP_APP_DOMAIN:-}
      BUNYIP_SHOW_BUSINESS_PRICING: ${BUNYIP_SHOW_BUSINESS_PRICING:-false}
      BUNYIP_COMMUNITY_URL: ${BUNYIP_COMMUNITY_URL:-}
      # BUNYIP-311 / BUNYIP-409: trusted-proxy CIDRs for the FIRST hop of the
      # client-IP trust chain (Traefik -> bunyip-web). bunyip-web reads the
      # end-user IP from the inbound X-Forwarded-For (set by Traefik) ONLY when
      # its own socket peer is inside these ranges, then forwards that IP to
      # bunyip-api. Defaults to the RFC1918 private ranges so the edge proxy is
      # trusted out of the box; empty left the forwarded IP dropped, so sessions
      # showed the internal Docker peer (BUNYIP-409). See docs/client-ip-forwarding.md.
      TRUSTED_PROXY_CIDR: ${WEB_TRUSTED_PROXY_CIDR:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "4400"
    ports:
      - "${HOST_IP:-127.0.0.1}:${BUNYIP_WEB_PORT:-4400}:4400"
    depends_on:
      - api
    networks:
      - private


volumes:
  postgres-data:
    name: bunyip-postgres-data
  oci-cache:
    name: bunyip-oci-cache
  download-cache:
    name: bunyip-download-cache

networks:
  private:
    name: bunyip-private
    driver: bridge
