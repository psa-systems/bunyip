[workspace]
members = [
    "bunyip-api",
    "bunyip-web",
    # Domain layer + verticals built on the generic dunite crates
    # (https://dev.a8n.run/psa-systems/dunite). See dev-docs/bunyip-on-dunite-scaffold.md.
    "crates/bunyip-domain",
    "crates/bunyip-oci",
    "crates/bunyip-oidc",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["PSA Systems"]
license = "MIT"
repository = "https://dev.a8n.run/psa-systems/bunyip"

# Workspace-wide lint policy. Crates opt in via `[lints] workspace = true`.
# too_many_arguments: actix handlers take one extractor per argument and
# repository functions take one argument per independent filter/column; a
# params struct would only relocate the list.
[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
parking_lot = "0.12"
serde_json = "1"
tracing = "0.1"
thiserror = "1"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"

[workspace.dependencies.tokio]
version = "1"
features = ["full"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "v7",
    "serde",
    "js",
]

[workspace.dependencies.chrono]
version = "0.4"
features = [
    "serde",
    "wasmbind",
]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[workspace.dependencies.validator]
version = "0.19"
features = ["derive"]
