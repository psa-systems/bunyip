# SPEC-14.1.1, SPEC-2.1.1: six members, virtual manifest
# SPEC-1.1: no member hosts a relying-party product
[workspace]
members = [
    "bunyip-api",
    "bunyip-web",
    "crates/bunyip-domain",
    "crates/bunyip-oci",
    "crates/bunyip-oidc",
    "crates/web-kit",
]
resolver = "2"

# SPEC-14.1.2: one version and metadata for every member
[workspace.package]
version = "0.21.0"
edition = "2021"
authors = ["PSA Systems"]
license = "MIT"
repository = "https://dev.a8n.run/psa-systems/bunyip"

# SPEC-14.1.3, SPEC-2.1.2: the only workspace-wide lint relaxation
[workspace.lints.clippy]
too_many_arguments = "allow"

# SPEC-14.1.4: shared pins so members cannot drift
[workspace.dependencies]
parking_lot = "0.12"
serde_json = "1"
tracing = "0.1"
thiserror = "2.0.21"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"

[workspace.dependencies.tokio]
version = "1"
features = ["full"]

[workspace.dependencies.serde]
version = "1"
features = ["derive"]

[workspace.dependencies.uuid]
version = "1.11"
features = [
    "v4",
    "serde",
]

[workspace.dependencies.chrono]
version = "0.4"
features = ["serde"]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]
