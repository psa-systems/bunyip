---

# Thin caller for the reusable Renovate workflow in psa-systems/common
# (`feat/renovate-reusable-workflow`, PC-91 follow-up). The definition
# lives there; this stub owns the schedule for THIS repo so an operator
# changing bunyip's cadence does not have to touch common.
#
# Renovate scans the tree against `renovate.json` at the repo root and
# opens PRs grouped by family (sqlx-*, actix-*, serde-*, dunite-*, ...).
# RENOVATE_CI_TOKEN is the org-level secret (`write:repository` +
# `write:issue` scope), passed explicitly to the reusable workflow.

name: Renovate

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  renovate:
    name: Renovate (caller)
    # The URL form was attempted on BUNYIP-1003 and reverted here on
    # BUNYIP-1005: this Forgejo instance does not schedule a cross-repo
    # reusable `uses:` called by its full URL unless the job also repeats
    # `runs-on` (the callee's own `vars.*` never resolves on its own), so the
    # dispatched job sat at "Waiting for a runner with the following
    # labels:" with the label list empty. BUNYIP-1018 restores the URL form
    # now that `runs-on` is repeated below, matching what
    # create-release.yml's caller already does; the SHA pin is tracked
    # separately from the ref (PSA-78).
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/renovate-reusable.yml@6b78b2c6c49402ee6178c82233ed3e25817f6572  # main; see comment above for the URL-form regression
    # MEDIUM: the same label the reusable workflow's own job uses; it runs
    # Renovate in a container and compiles nothing.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    with:
      target_repository: ${{ github.repository }}
    secrets:
      # secret-scope-ok: reusable workflow needs RENOVATE_CI_TOKEN (write:repository + write:issue) to open dependency-update PRs; this caller job runs no step and reads no secret itself. The name must match what the reusable workflow reads.
      RENOVATE_CI_TOKEN: ${{ secrets.RENOVATE_CI_TOKEN }}
      # Silences the "No github.com token has been configured" and
      # "Rate limit exceeded for api.github.com" dashboard warnings:
      # Renovate still has to reach github.com to resolve the real
      # github-hosted actions (Swatinem/rust-cache, crazy-max/*) and
      # the crates.io release-notes source lives on github.com too.
      # `PUBLIC_GITHUB_REPO_TOKEN` is a read-only PAT (org secret added
      # 2026-10-24) whose only scope is `public_repo`.
      PUBLIC_GITHUB_REPO_TOKEN: ${{ secrets.PUBLIC_GITHUB_REPO_TOKEN }}
