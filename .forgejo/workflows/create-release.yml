---

# Tag and publish a release when the workspace version is bumped.
#
# `just create-release <major|minor|hotfix>` opens a PR that bumps
# `workspace.package.version` in Cargo.toml. When that PR merges to main,
# this workflow reads the new version, creates the matching `vX.Y.Z` git
# tag, and publishes a Forgejo release. Pushing the tag re-triggers
# build.yml (see its `tags: ['v*']` trigger), which publishes the
# version-tagged OCI images.
#
# The push uses PSA_SYSTEMS_PRIVATE_PACKAGE_PAT (not the auto-injected
# token) on purpose: tags pushed with the auto token do NOT trigger
# downstream workflows. The PAT must have repository content read/write
# scope.
name: create-release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

jobs:
  tag-and-release:
    name: Tag and publish release
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: write
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}

      - name: Resolve version and tag
        id: resolve
        shell: nu {0}
        run: |
          let version = (open Cargo.toml | get workspace.package.version)
          let tag = $"v($version)"
          let exists = ((do { ^git rev-parse --quiet --verify $"refs/tags/($tag)" } | complete | get exit_code) == 0)
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($tag)\n" | save --append $env.GITHUB_OUTPUT
          $"exists=($exists)\n" | save --append $env.GITHUB_OUTPUT
          if $exists {
            print $"Tag ($tag) already exists; nothing to do."
          } else {
            print $"Will create and publish ($tag)."
          }

      - name: Create and push tag
        if: steps.resolve.outputs.exists == 'false'
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          ^git config user.name "forgejo-actions"
          ^git config user.email "forgejo-actions@dev.a8n.run"
          ^git tag --annotate $tag --message $"Release ($tag)"
          ^git push origin $tag

      - name: Publish Forgejo release
        if: steps.resolve.outputs.exists == 'false'
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let api = $"${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          let payload = {tag_name: $tag, name: $tag, draft: false, prerelease: false}
          (
            http post
              --content-type application/json
              --headers {Authorization: $"token ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}"}
              $api
              ($payload | to json)
          )
          print $"Published release ($tag)."
