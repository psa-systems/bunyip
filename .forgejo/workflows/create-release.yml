---

# Create a Forgejo release when a release/* branch is merged to main, by
# calling the reusable workflow in psa-systems/common.
#
# Everything the release does - deriving the tag from the branch name, building
# the changelog, and posting to the releases API - lives in
# psa-systems/common/.forgejo/workflows/create-release.yml. The caller keeps
# only what Forgejo cannot read from the called workflow: the trigger, the
# merged/`release/v` gate, `runs-on`, and `secrets: inherit`.
#
# Paired with the `just create-release <major|minor|hotfix>` recipe, which also
# comes from common/common.just. The recipe pushes `release/v<version>` and
# opens the PR; this workflow tags and publishes once that PR merges. Pushing
# the tag re-triggers build-api.yml and build-web.yml (their `tags: ['v*']`
# triggers), which publish the version-tagged OCI images.
#
# Secret: the reusable workflow reads FORGEJO_PAT, which needs
# `write:repository` scope to call the /api/v1/repos/.../releases endpoint.
name: Create release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    # psa-systems/common is the org's own shared workflow repo (same org, same
    # review gate as this one); tracking `@main` is how a shared-workflow fix
    # or a BUNYIP-444-style label rename reaches this caller. Narrowing this to
    # a SHA pin is tracked separately.
    uses: psa-systems/common/.forgejo/workflows/create-release.yml@main  # secret-scope-ok: same-org shared workflow repo, tracked separately for SHA pinning
    # MEDIUM: git plus two API calls, nothing compiles. Set here too because Forgejo
    # resolves a cross-repo reusable job's label in the caller (common README).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    # A called workflow receives no secret it is not passed, and the reusable
    # workflow needs FORGEJO_PAT.
    secrets: inherit  # secret-scope-ok: reusable workflow needs FORGEJO_PAT (write:repository) to call the releases API; this caller job runs no step and reads no secret itself
    # This job runs no step of its own, so the Nushell rule (BUNYIP-489) is
    # vacuous here; declared anyway so the gate stays absolute and a step added
    # to a caller job can never inherit Bash. The called workflow declares its
    # own shell.
    defaults:
      run:
        shell: nu {0}
