---

# Tag and publish a release when the workspace version is bumped.
#
# `just create-release <major|minor|hotfix>` opens a PR that bumps
# `workspace.package.version` in Cargo.toml. When that PR merges to main,
# this workflow reads the new version, creates the matching `vX.Y.Z` git
# tag, and publishes a Forgejo release. Pushing the tag re-triggers
# build.yml (see its `tags: ['v*']` trigger), which publishes the
# version-tagged OCI images.
#
# The push uses PSA_SYSTEMS_PRIVATE_PACKAGE_PAT (not the auto-injected
# token) on purpose: tags pushed with the auto token do NOT trigger
# downstream workflows. The PAT must have repository content read/write
# scope.
#
# This workflow is the ONLY producer of v* tags - humans never push them
# by hand. That keeps the "only main creates packages" policy intact: the
# v* trigger in build.yml only ever fires off a tag this automation pushed
# after a version bump landed on main.
name: create-release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

jobs:
  tag-and-release:
    name: Tag and publish release
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      exists: ${{ steps.resolve.outputs.exists }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}

      - name: Resolve version and tag
        id: resolve
        shell: nu {0}
        run: |
          let version = (open Cargo.toml | get workspace.package.version)
          let tag = $"v($version)"
          let exists = ((do { ^git rev-parse --quiet --verify $"refs/tags/($tag)" } | complete | get exit_code) == 0)
          $"version=($version)\n" | save --append $env.GITHUB_OUTPUT
          $"tag=($tag)\n" | save --append $env.GITHUB_OUTPUT
          $"exists=($exists)\n" | save --append $env.GITHUB_OUTPUT
          if $exists {
            print $"Tag ($tag) already exists; nothing to do."
          } else {
            print $"Will create and publish ($tag)."
          }

      - name: Create and push tag
        if: steps.resolve.outputs.exists == 'false'
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          ^git config user.name "forgejo-actions"
          ^git config user.email "forgejo-actions@dev.a8n.run"
          ^git tag --annotate $tag --message $"Release ($tag)"
          ^git push origin $tag

      - name: Publish Forgejo release
        # Always run (not gated on the tag being new) so a previous run
        # that pushed the tag but failed before creating the release can
        # recover on re-run. Idempotent: skips when the release exists.
        shell: nu {0}
        run: |
          let tag = "${{ steps.resolve.outputs.tag }}"
          let api = $"${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          let auth = {Authorization: $"token ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}"}

          let existing = (http get --allow-errors --full --headers $auth $"($api)/tags/($tag)")
          if $existing.status == 200 {
            print $"Release ($tag) already exists; nothing to do."
          } else {
            let payload = {tag_name: $tag, name: $tag, draft: false, prerelease: false}
            let resp = (
              http post --allow-errors --full
                --content-type application/json
                --headers $auth
                $api
                ($payload | to json)
            )
            if $resp.status >= 300 {
              print $"(ansi red)Release create failed: HTTP ($resp.status)(ansi reset)"
              print $resp.body
              exit 1
            }
            print $"Published release ($tag)."
          }

  binaries:
    name: Build and attach release binaries
    needs: tag-and-release
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag-and-release.outputs.tag }}
      VERSION: ${{ needs.tag-and-release.outputs.version }}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set up buildx builder
        # docker-container driver is required for --output type=local; the
        # default driver only supports loading into the local image store.
        run: docker buildx create --name release-bin-builder --driver docker-container --use

      - name: Build bunyip-api binary
        # `--target export` is the scratch stage in bunyip-api/oci-build/
        # Dockerfile that bundles the compiled binary + seeds/. The
        # rust:1-alpine builder produces a statically-linked musl binary
        # (musl-dev + openssl-libs-static + lld), so it runs on any Linux
        # without further dependencies.
        run: |
          mkdir --parents out-api
          docker buildx build \
            --target export \
            --output type=local,dest=out-api \
            --platform linux/amd64 \
            --file bunyip-api/oci-build/Dockerfile \
            .

      - name: Build bunyip-web static bundle
        # `--target export` is the scratch stage in bunyip-web/oci-build/
        # Dockerfile that surfaces the dx-built public/ dir (WASM +
        # assets). Arch-independent.
        run: |
          mkdir --parents out-web
          docker buildx build \
            --target export \
            --output type=local,dest=out-web \
            --platform linux/amd64 \
            --file bunyip-web/oci-build/Dockerfile \
            .

      - name: Package tarballs and checksums
        id: package
        shell: nu {0}
        run: |
          let tag = $env.TAG
          let api_dir = $"bunyip-api-($tag)-x86_64-linux-musl"
          let web_dir = $"bunyip-web-($tag)-static"
          let api_tar = $"($api_dir).tar.gz"
          let web_tar = $"($web_dir).tar.gz"

          mkdir $"staging/($api_dir)"
          mkdir $"staging/($web_dir)"

          # API: binary + seeds at the top of the wrapper dir.
          cp out-api/bunyip-api $"staging/($api_dir)/bunyip-api"
          ^chmod +x $"staging/($api_dir)/bunyip-api"
          ^cp --recursive out-api/seeds $"staging/($api_dir)/seeds"

          # Web: public/ at the top of the wrapper dir.
          ^cp --recursive out-web/web $"staging/($web_dir)/public"

          mkdir dist
          ^tar --create --gzip --file $"dist/($api_tar)" --directory staging $api_dir
          ^tar --create --gzip --file $"dist/($web_tar)" --directory staging $web_dir

          cd dist
          ^sha256sum $api_tar $web_tar | save --force SHA256SUMS
          print (open SHA256SUMS)
          cd ..

          $"api_tar=($api_tar)\n" | save --append $env.GITHUB_OUTPUT
          $"web_tar=($web_tar)\n" | save --append $env.GITHUB_OUTPUT

      - name: Upload artifacts to Forgejo release
        # Idempotent: each asset upload is skipped if an asset with that
        # name already exists on the release. Lets a failed previous run
        # be safely rerun without producing duplicate attachments.
        shell: nu {0}
        run: |
          let tag = $env.TAG
          let api = $"${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          let pat = "${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}"
          let auth = {Authorization: $"token ($pat)"}

          let release = (http get --full --headers $auth $"($api)/tags/($tag)")
          if $release.status != 200 {
            print $"(ansi red)Could not look up release for tag ($tag): HTTP ($release.status)(ansi reset)"
            print $release.body
            exit 1
          }
          let release_id = $release.body.id
          print $"Found release id ($release_id) for tag ($tag)."

          let existing_assets = (http get --headers $auth $"($api)/($release_id)/assets")
          let existing_names = ($existing_assets | get name)

          let artifacts = [
            "${{ steps.package.outputs.api_tar }}"
            "${{ steps.package.outputs.web_tar }}"
            "SHA256SUMS"
          ]

          for name in $artifacts {
            if ($name in $existing_names) {
              print $"Asset ($name) already attached; skipping."
              continue
            }
            let path = $"dist/($name)"
            let url = $"($api)/($release_id)/assets?name=($name)"
            print $"Uploading ($name) -> ($url)"
            (
              ^curl --fail-with-body --silent --show-error
                --request POST
                --header $"Authorization: token ($pat)"
                --form $"attachment=@($path)"
                $url
            )
            print $"\nUploaded ($name)."
          }
