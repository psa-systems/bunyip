---

# Create a Forgejo release when a release/v* tag is pushed, by
# calling the reusable workflow in psa-systems/common.
#
# Everything the release does - deriving the tag from the branch name, building
# the changelog, and posting to the releases API - lives in
# psa-systems/common/.forgejo/workflows/create-release.yml. The caller keeps
# only what Forgejo cannot read from the called workflow: the trigger,
# `runs-on`, and `secrets: inherit`.
#
# Paired with the release recipes in common/common.just. `just create-release
# <major|minor|hotfix>` pushes `release/v<version>` and opens the PR; after that
# PR merges, `just publish-release` pushes the `release/v<version>` tag on the
# merged commit, and that tag push is what triggers this workflow (BUNYIP-838 /
# PC-68). The reusable workflow then creates the `vX.Y.Z` tag and release, which
# re-triggers build-api.yml and build-web.yml (their `tags: ['v*']` triggers) to
# publish the version-tagged OCI images.
#
# Secret: the reusable workflow reads FORGEJO_PAT, which needs
# `write:repository` scope to call the /api/v1/repos/.../releases endpoint.
name: Create release

# Not `pull_request` (BUNYIP-721): that trigger runs the PR head's copy of this
# file, so the registry PAT passed below was reachable from any pushed branch.
# A tag push runs the definition on the tagged commit, which a maintainer
# created after review.
on:
  push:
    tags:
      - 'release/v*'

jobs:
  # A reusable-workflow caller is a PURE `uses:` job. Forgejo 16's schema accepts
  # only uses / with / secrets / needs / if on such a job and rejects the whole
  # workflow ("Unknown Property defaults", "Failed to match workflow-job") when a
  # normal-job key like `runs-on` or `defaults` appears beside `uses` (BUNYIP-838;
  # BUNYIP-721 added both and no release ran to catch it). So the runner label
  # lives on the reusable workflow's own job (common sets
  # RUNS_ON_OPENSUSE_BASE_MEDIUM there, resolved in this repo's context), and this
  # job declares no `defaults` shell because it runs no step of its own.
  # psa-systems/common is the org's own shared workflow repo; `@main` is how a
  # shared-workflow fix reaches this caller, and a SHA pin is tracked separately.
  create-release:
    uses: psa-systems/common/.forgejo/workflows/create-release.yml@main  # secret-scope-ok: same-org shared workflow repo, tracked separately for SHA pinning
    secrets: inherit  # secret-scope-ok: reusable workflow needs FORGEJO_PAT (write:repository) to call the releases API; this caller job runs no step and reads no secret itself
