---

# Publish both images for a release tag (BUNYIP-994).
#
# common's create-release workflow creates the `vX.Y.Z` release and tag through
# the Forgejo API, which raises no tag-push event, so build-api.yml and
# build-web.yml (which publish `vX.Y.Z` on a `v*` tag push) never start on
# their own. common dispatches ONE workflow after the release
# (`dispatch_workflow` in create-release.yml); this is that workflow, and it
# dispatches both image builds with the tag, which they treat as a real release
# build of that tag. Both are dispatched together, so the api and web images
# of a release can never come from different runs of this workflow.
name: Release images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish both images for (e.g. v0.20.0); set by create-release"
        type: string
        default: ""

jobs:
  dispatch:
    name: Dispatch the api and web image builds
    # MEDIUM: two API calls, nothing compiles (see governance CI.md "Runner labels").
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    defaults:
      run:
        shell: nu {0}

    steps:
      - name: Dispatch build-api.yml and build-web.yml with the tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
          # Dispatch-only workflow, never PR-triggered: the org-level PAT
          # (write:repository) is what the actions dispatch API needs.
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_PAT }}
        run: |
          let tag = ($env.RELEASE_REF | str trim)
          if not ($tag | str starts-with "v") {
            error make { msg: $"ref must be a v* release tag, got '($tag)'" }
          }
          if ($env.FORGEJO_TOKEN? | default "" | is-empty) {
            error make { msg: "secrets.FORGEJO_PAT is unset; cannot dispatch the image builds" }
          }
          let api_base = $"($env.GITHUB_SERVER_URL)/api/v1/repos/($env.GITHUB_REPOSITORY)"
          for workflow in ["build-api.yml" "build-web.yml"] {
            # The workflow file is read from main; `inputs.ref` pins the build's
            # checkout and its published tag to the release tag.
            http post --content-type application/json --headers [Authorization $"token ($env.FORGEJO_TOKEN)"] $"($api_base)/actions/workflows/($workflow)/dispatches" { ref: "main", inputs: { ref: $tag } }
            print $"Dispatched ($workflow) for ($tag)"
          }
