---

# Credential-free E2E gate for pull requests (BUNYIP-425).
#
# A `pull_request` run executes the workflow file, the npm lifecycle scripts
# and the Playwright specs from the PR HEAD, i.e. code that has not been
# reviewed. Anything this job can read, the author of any branch can
# exfiltrate. So it holds NOTHING that authenticates: no account password, no
# TOTP seed, no Stripe key, no mail-sink credentials. The only secrets in the
# env: block are the two staging base URLs the reachability probe needs, and
# neither grants access to anything.
#
# What that buys and what it costs: the PR still catches a broken lockfile, a
# broken Playwright install and a staging deployment that is not serving, but
# it does NOT run the suite. Post-merge validation is `e2e.yml` on push to
# main; a PR-time full suite is a maintainer-triggered `workflow_dispatch` on
# that workflow, taken after reading the diff.
# Workflow name is `E2E` (not `E2E PR gate`) so the published check is
# `<workflow> / <job>` = `E2E / PR gate`, matching the `E2E /*` pattern beside
# e2e.yml's `E2E / deployment` (BUNYIP-478). Two workflow files share the `E2E`
# display name; their file paths and job names keep them distinct.
#
# All three steps of the `PR gate` job (the npm install, the Playwright
# browser download and the staging reachability probe) can be skipped
# together for a docs-only or comment-only PR: none of them depends on
# anything the PR can change besides the lockfile and the e2e/ sources, and
# the probe is a soft check of staging, not of this PR's code. They are
# gated with a job-level `if:` on the shared `classify-diff` action's result
# (PC-134, BUNYIP-1040, STD-3.1/3.2), run from its own small job below, not a
# workflow-trigger `paths`/`paths-ignore` filter: Forgejo drops the whole
# workflow when a trigger filter does not match, so the required `E2E / PR
# gate` check never reports for the PRs it was meant to cost nothing; a
# job-level `if:` still reports the job (skipped), which satisfies branch
# protection.
# SPEC-3.9.1
name: E2E

on:
  pull_request:
    branches:
      - main

# SPEC-3.9.2
concurrency:
  # Separate from e2e.yml's `e2e-bunyip` group: this job never logs in, so it
  # cannot trip the 5-logins/min/email limit that forces the suite serial.
  # Superseded PR commits are cancelled.
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SPEC-3.9.3
  classify-diff:
    name: Classify diff
    # MEDIUM: the composite action runs one nu-script over `git diff`; it
    # compiles nothing and launches no browser (BUNYIP-446, BUNYIP-1040).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    # Declared once per job so a new step cannot silently inherit Bash;
    # scripts/check-workflow-shell.nu gates it.
    defaults:
      run:
        shell: nu {0}

    outputs:
      result: ${{ steps.classify-diff.outputs.result }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v7

      - name: Classify diff
        # Always `code` outside a pull_request event (PC-134, BUNYIP-1040).
        # The action deepens this job's shallow checkout itself when it needs
        # HEAD^1, so no fetch-depth change is needed here.
        id: classify-diff
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/classify-diff@main

  # SPEC-3.9.4
  e2e-pr:
    # BUNYIP-478: renders as `E2E / PR gate` (workflow `E2E` / job `PR gate`).
    # The credential-free PR gate that branch protection requires on pull
    # requests; counterpart is `E2E / deployment` in e2e.yml.
    name: PR gate
    needs: classify-diff
    # Skipped (reported, not dropped) unless the diff contains code (PC-134,
    # BUNYIP-1040): see the header comment for why this is a job-level `if:`
    # on the classifier output rather than a trigger-level path filter.
    if: ${{ needs.classify-diff.outputs.result == 'code' }}
    # MEDIUM: npm ci, a browser download and an HTTP probe; it compiles nothing and
    # never launches a browser, so it needs no dev-image library (BUNYIP-446).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    # Declared once per job so a new step cannot silently inherit Bash;
    # scripts/check-workflow-shell.nu gates it.
    defaults:
      run:
        shell: nu {0}
        working-directory: e2e

    # The complete credential surface of this job. Adding any other secret here
    # hands it to unreviewed PR code; put the step in e2e.yml instead.
    # scripts/check-workflow-secrets.nu enforces this.
    # SPEC-3.9.5: complete credential surface of a PR-triggered job
    env:
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_OP_BASE_URL: ${{ secrets.OIDC_ISSUER_STAGING }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v7

      # See e2e.yml for why npm/npx run through corepack and node scripts use
      # the concrete node24 binary. --ignore-scripts: no dependency lifecycle
      # script runs on PR-authored content.
      # SPEC-3.9.6
      - name: Install dependencies
        run: corepack npm ci --ignore-scripts

      # Download only: no browser launch here, this proves the install
      # resolves. That is why the MEDIUM label is correct for this job: nothing
      # ever launches, so no browser system libraries are needed. The suite
      # that actually drives a browser runs in e2e.yml, on the HEAVY label.
      - name: Install Playwright browser
        run: corepack npx playwright install chromium

      - name: Verify deployment is reachable
        # BUNYIP-301: the hub /healthz probe is SOFT on pull_request. A PR's
        # SHA never deploys, so a broken staging deploy is not a signal about
        # this PR's quality; a hard check would deadlock any PR that lands
        # during an outage, including the PR that fixes it.
        env:
          E2E_HUB_SOFT: "true"
        run: node24 scripts/health-check.mjs
