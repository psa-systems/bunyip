---

# Audit Cargo.lock against the RustSec advisory database on a cadence.
# .forgejo/workflows/check.yml runs the same guard on every push and pull
# request; this one exists for the case that never triggers, an advisory
# published against a Cargo.lock nobody has touched (BUNYIP-905).
name: Audit

# SPEC-3.1.1: weekly sweep catches advisories on an unchanged lockfile
on:
  schedule:
    # Mondays, 06:17 UTC. Forgejo only reads `schedule:` from the default
    # branch, so this starts running once the change is on main.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    # HEAVY: the guard needs cargo and installs cargo-audit when the image does
    # not already carry it, falling back to a source build when cargo binstall
    # is unavailable, which needs the C toolchain the dev image carries
    # (BUNYIP-444).
    # SPEC-3.1.2
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}

    # Every step in this repo runs under Nushell (BUNYIP-489).
    defaults:
      run:
        shell: nu {0}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      # SPEC-3.1.3
      - name: Cache Rust build
        # For CARGO_HOME, so the cargo-audit install is paid for once rather than
        # on every scheduled run. `shared-key: audit` names the cache so
        # successive weekly runs restore each other's state instead of
        # falling back to rust-cache's per-ref isolation (which on a
        # schedule trigger with no ref, varies across runs). check.yml
        # does not use rust-cache (its cargo job relies on the runner's
        # local persistent cargo home per the header comment there), so
        # there is nothing on main to share with; this key is scoped to
        # this workflow's own history.
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          shared-key: audit
          cache-on-failure: true

      # SPEC-3.1.4: self-test first so a blind guard fails
      - name: Dependency audit
        # Same guard and same policy as the check workflow: a vulnerability with
        # no dated exception fails, warnings are reported. --self-test first, so a
        # guard that stopped parsing fails the job rather than passing vacuously.
        run: |
          ./scripts/check-dependency-audit.nu --self-test
          ./scripts/check-dependency-audit.nu
