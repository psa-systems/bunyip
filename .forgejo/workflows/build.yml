name: build

on:
  push:
    branches:
      - chore/initial-setup
      - main
  pull_request:

jobs:
  check:
    name: Lint and type-check
    runs-on: docker
    container:
      image: rust:1-slim-trixie
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends pkg-config libssl-dev curl ca-certificates
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

  build-image:
    name: Build and push OCI image
    runs-on: docker
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/chore/initial-setup' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: dev.a8n.run
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bunyip-api/oci-build/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            dev.a8n.run/psa-systems/bunyip-api:latest
            dev.a8n.run/psa-systems/bunyip-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bunyip-web/oci-build/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            dev.a8n.run/psa-systems/bunyip-web:latest
            dev.a8n.run/psa-systems/bunyip-web:${{ github.sha }}
