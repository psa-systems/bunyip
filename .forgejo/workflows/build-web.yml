---

# Build the bunyip-web OCI image and push it to the Forgejo Container Registry
# (dev.a8n.run/psa-systems-private/bunyip-web).
#
# bunyip-web is a workspace member (inherits [workspace.package] + workspace
# dependencies from the root Cargo.toml), so the Docker context is the repo
# root and the build compiles just the bunyip-web binary. The glibc builder
# image carries bun + tailwind for the CSS step.
name: Build Web image

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feature-*"
    tags:
      - "v*"
    paths:
      - "bunyip-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "oci-build/**"
      - ".forgejo/workflows/build-web.yml"

jobs:
  build-and-push-web:
    name: Build and push Web image
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REGISTRY: ""
      REGISTRY_PROVIDER: dev.a8n.run
      REGISTRY_OWNER: ${{ vars.PSA_SYSTEMS_PRIVATE_PACKAGE_OWNER }}
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ${{ secrets.PSA_SYSTEMS_PRIVATE_PACKAGE_PAT }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Docker availability
        run: |
          docker version
          docker buildx version

      - name: Set up buildx builder
        run: |
          docker buildx create --name container-builder --driver docker-container --use

      - name: Export Actions runtime env for buildx gha cache
        # A raw `docker buildx build` (unlike docker/build-push-action)
        # does not auto-inject the gha cache backend's env, and
        # ACTIONS_RUNTIME_TOKEN is masked from run: steps. This action
        # re-exports ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN into
        # GITHUB_ENV so the build step's `type=gha` cache can reach
        # act_runner's cache server (needs runner cache.enabled: true).
        uses: https://github.com/crazy-max/ghaction-github-runtime@v3

      - name: Set environment variables
        shell: nu {0}
        run: |
          let owner = $env.REGISTRY_OWNER
          $"REGISTRY_USER=($owner)\n" | save --append $env.GITHUB_ENV
          $"IMAGE_REGISTRY=($env.REGISTRY_PROVIDER)/($owner)\n" | save --append $env.GITHUB_ENV

      - name: Get image tags
        id: get-tags
        shell: nu {0}
        run: |
          let tags = (^nu oci-build/get-tags.nu --joined)
          $"tags=($tags)\n" | save --append $env.GITHUB_OUTPUT

      - name: Log in to container registry
        shell: nu {0}
        run: |
          ^docker login --username $env.REGISTRY_USER --password $env.REGISTRY_PASSWORD $env.REGISTRY_PROVIDER

      - name: Build and push Web image
        shell: nu {0}
        run: |
          let tags_str = "${{ steps.get-tags.outputs.tags }}"
          let tags = ($tags_str | split row ",")
          let image = "bunyip-web"
          let registry = $env.IMAGE_REGISTRY
          let tag_args = ($tags | each {|tag| [-t $"($registry)/($image):($tag)"]} | flatten)
          # Cache to act_runner's built-in Actions cache server (type=gha) instead of the
          # registry. type=registry round-tripped ~1.7 GiB over the WAN every build and 499'd
          # the export on slow-upload runners, so reuse never worked there.
          # type=gha caches per repo; this repo builds more than one image, so scope=($image)
          # gives each image its own namespace (GOV-21) instead of overwriting each other.
          let cache_from = $"type=gha,scope=($image)"
          # mode=max keeps the dependency-build layer; ignore-error keeps a cache hiccup (or a
          # disabled runner cache) from failing the build.
          let cache_to = $"type=gha,scope=($image),mode=max,ignore-error=true"
          let git_commit = (^git rev-parse --short HEAD | str trim)
          let git_tag = (^git describe --tags --always --dirty | str trim)
          let build_date = (date now | format date "%Y-%m-%dT%H:%M:%SZ")
          # nproc/2 cap: never claim more than half the host (governance CI.md).
          let jobs = ((sys cpu | length) / 2 | into int)
          let build_args = [
              --build-arg $"GIT_COMMIT=($git_commit)"
              --build-arg $"GIT_TAG=($git_tag)"
              --build-arg $"BUILD_DATE=($build_date)"
              --build-arg $"CARGO_BUILD_JOBS=($jobs)"
          ]
          print $"Building and pushing ($image) with tags: ($tags_str), commit=($git_commit), tag=($git_tag), date=($build_date)"
          # Context is the repo root; the Dockerfile builds only the bunyip-web binary.
          ^docker buildx build --push --cache-from $cache_from --cache-to $cache_to ...$build_args ...$tag_args -f bunyip-web/oci-build/Dockerfile .

      - name: Print image URLs
        shell: nu {0}
        run: |
          let tags_str = "${{ steps.get-tags.outputs.tags }}"
          let tags = ($tags_str | split row ",")
          let image = "bunyip-web"
          let registry = $env.IMAGE_REGISTRY
          for tag in $tags {
            print $"Image pushed to ($registry)/($image):($tag)"
          }
