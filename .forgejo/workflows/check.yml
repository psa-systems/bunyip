---

# Check: formatting, clippy, build, and unit tests on every push / PR.
# Runs on the runner host (not in Docker) so the cargo cache is reused between
# runs. bunyip-oidc has the only compile-time sqlx::query! macros; SQLX_OFFLINE
# resolves them against the committed .sqlx cache, so no database is needed. The
# generic dunite-core kernel is an anonymously-readable Forgejo git dependency
# (network only, no credentials).
#
# Split into two parallel jobs. `cargo` on BASE_HEAVY (dev image, C toolchain)
# runs fmt / clippy / check / unit / docker-builder / audit. `guards` on
# BASE_MEDIUM runs every nu-script + justfile guard (migration, workflow,
# source-literal, doc, tailwind, publish-trigger). `secrets` keeps its own
# base-medium job unchanged.
#
# check-runner-labels.nu greps for the HEAVY label somewhere in this file
# (the cargo job carries it) and for an annotation above every `runs-on:`
# (both new jobs carry one).  check-workflow-shell.nu iterates every job
# and requires `defaults.run.shell: nu {0}`; both new jobs declare it.
#
# The `cargo` job calls the shared `classify-diff` action (PC-134, BUNYIP-1040)
# right after checkout and gates Clippy, the lockfile-sync check, Unit tests
# and the docker builder stage on its `code` result, and `cargo fmt` on its
# result not being `non-code`. This replaces no local classifier: this
# workflow never carried one, only the push trigger's `paths:` include-list
# and the pull_request trigger's narrow `paths-ignore:` above, which stay as
# they are (STD-3.1 covers a skip decision for compile/test/fmt work, not a
# `push` trigger's rebuild-filter equivalent, and neither filter here decides
# that). Every guard step (justfile validation, migration checks, workflow
# guards, tree ownership, the secrets job) stays ungated, and so does
# Dependency audit, which is unrelated to this PR's diff.
name: Check

on:
  push:
    branches:
      - main
    paths:
      - "bunyip-api/**"
      - "bunyip-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".sqlx/**"
      - "scripts/**"
      # All workflows, not just this one: the secret-scope gate below reads
      # e2e.yml / e2e-pr.yml (BUNYIP-425).
      - ".forgejo/workflows/**"

  pull_request:
    branches:
      - main
    # No `paths-ignore:` here (STD-3.1, BUNYIP-1040): a workflow-level filter
    # on a `pull_request` trigger drops the whole workflow when it does not
    # match, so a required check never reports for the PRs it was meant to
    # cost nothing. The guard job still runs on every PR regardless of the
    # diff; the `cargo` job's classify-diff step below is what skips
    # Clippy, the lockfile-sync check, Unit tests, the docker builder stage
    # and `cargo fmt` for a docs-only or comment-only PR instead.

# Supersede obsolete runs. `github.ref` differs between the pull_request
# ref (refs/pull/<N>/merge) and the main push (refs/heads/main), so PRs
# never share a group with each other or with the main push that primes
# the runner's local cargo cache for them. A back-to-back main push does
# share the group, and that is the one case where cancel-in-progress
# matters here: two concurrent main runs are a wasted compile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: fmt + clippy + check + tests + docker + audit
    # HEAVY: native cargo build/test plus a docker build; the dev image carries the
    # C toolchain and OpenSSL headers crate build scripts need (BUNYIP-444, DEV-769).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_HEAVY }}
    env:
      SQLX_OFFLINE: "true"
      # Disk-footprint controls. CI doesn't need full DWARF debug info -
      # nothing here runs a debugger - and `-C debuginfo=2` (cargo's dev
      # default) bloats `target/` past 10GB per workspace. `line-tables-only`
      # keeps enough info for readable test panics and rustc backtraces while
      # cutting the on-disk size ~50%. Combined with disabling incremental
      # (which builds a separate per-job dep tree that gets thrown away on
      # the next runner allocation anyway), this keeps the runner's
      # /workspace from filling up between consecutive PR jobs - the
      # ENOSPC failures we hit on three back-to-back bunyip-upgrade PRs
      # were all this.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    # Declared once per job so a new step cannot silently inherit Bash;
    # scripts/check-workflow-shell.nu gates it.
    defaults:
      run:
        shell: nu {0}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Shallow is fine for cargo: no step here walks git log. The
          # migration-immutability guard moved to the `guards` job below,
          # which checks out deep on purpose.
          # The root justfile opens with `import 'common/common.just'`, so an
          # absent submodule is a parse error and the `just check-tree-ownership`
          # step at the end of this job would fail.
          submodules: true

      - name: Classify diff
        # Skips Clippy, the lockfile-sync check, Unit tests and the docker
        # builder stage unless the PR diff contains code, and skips
        # `cargo fmt` only when the diff is non-code; always `code` outside a
        # pull_request event (PC-134, BUNYIP-1040, STD-3.1/3.2). The action
        # deepens this job's shallow checkout itself when it needs HEAD^1, so
        # no fetch-depth change is needed here.
        id: classify-diff
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/classify-diff@main

      - name: Take build parallelism from the runner
        # Exports CARGO_BUILD_JOBS / NEXTEST_TEST_THREADS / CI_JOBS; warns and
        # falls back to a low CPU-derived value when the runner did not set them (DEV-769).
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/build-parallelism@main

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Cache cargo-binstall binary
        # Version-keyed cache of the installed binary. A hit restores
        # ~/.cargo/bin/cargo-binstall, and the install step below sees
        # `which cargo-binstall` return a path and no-ops. The runner's
        # local persistent cache (header comment) keeps WARM runs fast
        # on one runner; this one keeps COLD runs on a different runner
        # fast too. Bump this key literal in step with the version
        # literal in the next step.
        uses: https://github.com/actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-binstall
          key: cargo-binstall-1.14.3-linux-musl

      - name: Ensure cargo-binstall is on PATH
        # check-dependency-audit.nu's `ensure-audit` uses cargo-binstall when
        # it is available and falls back to `cargo install --locked cargo-audit`
        # when it is not. The CI runner image ships no binstall, so the
        # fallback compiled cargo-audit from source: aws-lc-sys wrote ~2 GB
        # of scratch into /tmp and the runner's /tmp ran out of space partway
        # through, failing with `No space left on device`. Install the pinned
        # cargo-binstall release tarball directly into $HOME/.cargo/bin so
        # the audit step takes the binary-download path. On a warm runner
        # (binary already present, including one restored from the
        # actions/cache step above) this step skips the download.
        #
        # Detection by FILE EXISTENCE, not `which`: rust-builder-glibc
        # puts CARGO_HOME=/usr/local/cargo on PATH, NOT $HOME/.cargo/bin,
        # so an earlier cache-restored binary is invisible to `which` and
        # the install step would re-download it. The GITHUB_PATH append
        # below also runs in BOTH branches, because the current step's
        # PATH is frozen at step start and the next step (`cargo binstall
        # ...` via the audit step) only sees GITHUB_PATH additions from
        # earlier steps.
        run: |
          let bin_dir = $"($env.HOME)/.cargo/bin"
          let bin = $"($bin_dir)/cargo-binstall"
          if ($bin | path exists) {
              print "cargo-binstall already present; skipping download"
          } else {
              let ver = "1.14.3"
              let url = $"https://github.com/cargo-bins/cargo-binstall/releases/download/v($ver)/cargo-binstall-x86_64-unknown-linux-musl.tgz"
              let tmp = (mktemp --tmpdir --suffix .tgz)
              http get $url | save --force $tmp
              mkdir $bin_dir
              ^tar -xzf $tmp -C $bin_dir cargo-binstall
              ^chmod +x $bin
              rm $tmp
              # Prove the extracted binary works via direct invocation,
              # so a silent fault (tar member mismatch, non-executable
              # mode, mangled download) fails the step here instead of
              # letting the next step compile cargo-audit from source
              # and exhaust /tmp. Use `--help` rather than `--version`:
              # cargo-binstall's `--version <VERSION>` is a flag that
              # takes a target package version to install (not a
              # print-version flag), so invoking it without a value is a
              # clap parse error. `--help` is a plain clap default and
              # exits 0 if the binary is callable.
              ^$bin --help | ignore
          }
          # Always append bin_dir to GITHUB_PATH. The cargo-subcommand
          # form `cargo binstall ...` depends on $HOME/.cargo/bin being
          # on PATH, which this image does not guarantee for the runner
          # user, and neither the download branch nor the cache-hit
          # branch sees PATH mutations until the NEXT step. Keeping the
          # append outside the if/else makes the step idempotent across
          # cache-hit and cache-miss.
          $"($bin_dir)\n" | save --append --raw $env.GITHUB_PATH

      - name: Dependency audit
        # Cargo.lock against the RustSec advisory database: an uncovered
        # vulnerability fails, a warning is reported only, and the one
        # pre-populated EXCEPTIONS row (rsa via sqlx-mysql, never compiled in)
        # suppresses that advisory until its dated review (BUNYIP-905). Runs on
        # the runner host like the rest of this job, so the cargo-audit install
        # is reused from the host's persisted cargo cache rather than paid for
        # on every push. --self-test first, so a gate that stopped detecting
        # anything fails the build instead of passing vacuously.
        run: |
          ./scripts/check-dependency-audit.nu --self-test
          ./scripts/check-dependency-audit.nu

      - name: Check formatting
        # Skipped only when the diff is non-code; still runs on comments-only,
        # since whitespace/formatting is exactly what a comment-only edit can
        # break (PC-134, BUNYIP-1040).
        if: ${{ steps.classify-diff.outputs.result != 'non-code' }}
        run: cargo fmt --all --check

      - name: Clippy
        # Skipped unless the diff contains code (PC-134, BUNYIP-1040).
        if: ${{ steps.classify-diff.outputs.result == 'code' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify Cargo.lock is in sync
        # --locked errors if the lockfile would need updating, catching a
        # manifest bump (e.g. a release) that forgot to sync Cargo.lock
        # (BUNYIP-59). `cargo check` walks the full resolution graph and
        # fingerprints every workspace member the same way `cargo build`
        # would; the preceding clippy step above already compiled every
        # target (`cargo clippy --workspace --all-targets`) and `--locked`
        # is the only thing THIS step proves, so swap `build` for the
        # cheaper `check` and save the 30-90s cold-cache compile.
        # Skipped unless the diff contains code (PC-134, BUNYIP-1040): this
        # is the compile-equivalent step named in the issue as "build".
        if: ${{ steps.classify-diff.outputs.result == 'code' }}
        run: cargo check --workspace --all-targets --locked

      - name: Unit tests
        # --all-targets (not --lib) so binary-crate tests run too: bunyip-web
        # is a bin-only crate, and `--lib` silently skips its entire test suite
        # (BUNYIP-271). The registration-form field-error guards live there.
        # Skipped unless the diff contains code (PC-134, BUNYIP-1040).
        if: ${{ steps.classify-diff.outputs.result == 'code' }}
        run: cargo test --workspace --all-targets

      - name: Docker builder stage
        # Build the api image's builder stage only - catches Docker-build drift
        # cheaply, mirroring `just check-docker`. The runner reuses its image
        # store between jobs, and buildkit's exporter refuses to overwrite an
        # existing tag ("image ... already exists", BUNYIP-231). Drop any
        # builder image a prior run left behind so the rebuild can re-tag;
        # piping through `complete` captures the exit code and stderr instead
        # of raising, so the first run (tag absent) stays green, matching the
        # `docker image rm` cleanup in the justfile's `dev-clean-all` recipe.
        #
        # BUNYIP-241: buildkit's default-on provenance / SBOM attestation makes
        # the exporter emit BOTH an image manifest AND an attestation manifest
        # list and name both under the requested tag, which collides inside a
        # single run ("image already exists" after `naming to ... done`). The
        # check step does not consume the resulting image (it only validates
        # that the build succeeds), so `--provenance=false` collapses the
        # export to one manifest with no observable downside.
        #
        # Nushell has no backslash line continuation, so the build stays on one
        # line.
        #
        # Skipped unless the diff contains code (PC-134, BUNYIP-1040).
        if: ${{ steps.classify-diff.outputs.result == 'code' }}
        run: |
          ^docker image rm bunyip-api-builder:check | complete | ignore
          ^docker build --provenance=false --build-arg $"CARGO_BUILD_JOBS=($env.CARGO_BUILD_JOBS)" --file bunyip-api/oci-build/Dockerfile --target builder --tag bunyip-api-builder:check .

      - name: Check the working tree is fully owned by the runner user
        # Last, so it sees the tree every container above left behind: the
        # api builder-stage build. A containerised step that runs as root leaves
        # files only sudo can remove (DEV-371), and `just pre-commit` cannot
        # be relied on to catch it because the compose dispatcher exits early
        # when no Rust or Cargo path is staged - which is exactly the file
        # set (justfile, compose.dev.yml, scripts/) that reintroduces one
        # (BUNYIP-647).
        run: just check-tree-ownership

      - name: Report job metrics
        # Last and always(), so a failing job still reports (composite actions have no post hook).
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main

  guards:
    name: justfile + migration + workflow + source + doc + tailwind guards
    # Base-medium label: every step is a nu-script grep, a `just` recipe,
    # or a tailwind rebuild that falls through to the rust-builder-glibc
    # docker image; no cargo native compile, no docker builder-stage
    # build. check-runner-labels.nu greps check.yml for the HEAVY string
    # (the cargo job above carries it) and audits the no-run-time-install
    # rule, both of which this split preserves.
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    # Declared once per job so a new step cannot silently inherit Bash;
    # scripts/check-workflow-shell.nu gates it.
    defaults:
      run:
        shell: nu {0}

    # Backstop, not a target. The guard set is ~25 nu/just invocations
    # that each take seconds; the full job runs in under a minute on a
    # warm runner.
    timeout-minutes: 15

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the migration-immutability gate can diff against the
          # merge-base with origin/main (BUNYIP-293).
          fetch-depth: 0
          # The root justfile opens with `import 'common/common.just'`, so an
          # absent submodule is a parse error and every `just` step below fails.
          submodules: true

      - name: Start job metrics sampler
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-start@main

      - name: Validate the justfile
        # First, because it is the cheapest step and its failure invalidates
        # every local recipe (`just check`, `just pre-commit`, the git hook).
        # `--summary` parses the justfile and its imports and prints the recipe
        # names without executing a body; `--evaluate` is not used, it resolves
        # assignments and can run backtick expressions.
        run: just --summary

      - name: Check for shadowed common recipes
        # The hook, tree-ownership and release recipes come from
        # common/common.just, and `set allow-duplicate-recipes` lets a local
        # copy silently win. This is what stops the fork coming back
        # (BUNYIP-567).
        run: just check-justfile

      - name: Check migration version numbers
        # Unique + uniform 14-digit prefix; blocks the suffix collisions that
        # parallel branches reintroduce (BUNYIP-79). Delegates to the shared
        # recipe in common.just (PC-79, BUNYIP-870).
        run: just check-migration-versions

      - name: Check migration immutability
        # Reject edits/renames/deletes of already-committed migrations; sqlx
        # checksums applied migrations and a deployed DB refuses to boot if one
        # changes. Add a new migration instead. Shared recipe (PC-82).
        run: just check-migration-immutability

      - name: Check PR-triggered workflows hold no credentials
        # A pull_request run executes the PR head's workflow, lifecycle scripts
        # and specs, so any secret it can read leaks to anyone who can push a
        # branch. Keeps the E2E suite off pull_request and the PR gate down to
        # the two base URLs (BUNYIP-425). Runs the justfile recipe so the
        # negative fixture runs first, so a gate that stopped detecting
        # anything fails the build instead of passing vacuously.
        run: just check-workflows

      - name: Check every workflow step runs under Nushell
        # Every job declares `defaults.run.shell: nu {0}` and no step opts back
        # into another shell, so a new step cannot silently inherit Bash
        # (BUNYIP-489). --self-test first, so a gate that stopped detecting
        # anything fails the build instead of passing vacuously.
        run: |
          ./scripts/check-workflow-shell.nu --self-test
          ./scripts/check-workflow-shell.nu

      - name: Check the API response models stay skew-tolerant
        # Every field of a Deserialize struct in bunyip-web/src/api/types.rs
        # defaults unless it is in the guard's ESSENTIAL_FIELDS table, so a
        # field renamed or added by a newer bunyip-api degrades instead of
        # breaking the decode (BUNYIP-506). --self-test first, so a gate that
        # stopped detecting anything fails the build instead of passing vacuously.
        run: |
          ./scripts/check-serde-compat.nu --self-test
          ./scripts/check-serde-compat.nu

      - name: Check runner labels
        # Keep the native cargo job on the HEAVY (dev image) label, no job on a
        # retired *_LATEST label, every label annotated, and no run-time
        # toolchain install (BUNYIP-444, DEV-769).
        run: ./scripts/check-runner-labels.nu

      - name: Check security invariants
        # Grep-assert the shapes the BUNYIP-426 audit sweep removed: cookie
        # Secure derived from the transport, dunite pinned by rev, no signup
        # enumeration oracle, base images pinned by digest. None of these fails
        # a compile, so they need an explicit gate.
        run: ./scripts/check-security-invariants.nu

      - name: Check Stripe config stays DB-only
        # No STRIPE_* env surface outside the e2e harness. An env read compiles
        # fine but reinstates the "container env overrides the admin" behaviour
        # removed in BUNYIP-482.
        run: ./scripts/check-no-stripe-env.nu

      - name: Check the retired env names stay gone
        # The at-rest key stays single - TOTP, Stripe and SMTP secrets are all
        # protected by APP_ENCRYPTION_KEY (BUNYIP-483) - and the dead
        # BUNYIP_OIDC_* relying-party variables stay removed (BUNYIP-539).
        run: ./scripts/check-no-retired-env.nu

      - name: Check bunyip-web env vars stay documented
        # Every variable Config::from_env reads in bunyip-web/src/config.rs
        # must have a .env.example entry, or a deployer has no way to
        # discover it exists (BUNYIP-720). --self-test first, so a gate that
        # stopped detecting anything fails the build instead of passing
        # vacuously.
        run: |
          ./scripts/check-env-parity.nu --self-test
          ./scripts/check-env-parity.nu

      - name: Check compose files stay in web-origin parity
        # Every compose file that runs bunyip-api must set APP_URL and
        # BUNYIP_WEB_ORIGIN explicitly to that stage's real web origin, or the
        # OIDC login bounce and every transactional-email link silently
        # resolve to CORS_ORIGIN's first entry instead (BUNYIP-749).
        # --self-test first, so a gate that stopped detecting anything fails
        # the build instead of passing vacuously.
        run: |
          ./scripts/check-compose-env-parity.nu --self-test
          ./scripts/check-compose-env-parity.nu

      - name: Check Argon2 stays off the actix workers
        # Every hash and verify goes through services::argon2_offload, so a
        # ~100 ms Argon2 never blocks a worker arbiter (BUNYIP-553). A direct
        # call compiles fine, so it needs an explicit gate. --self-test first,
        # so a gate that stopped detecting fails the job rather than passing.
        run: |
          ./scripts/check-argon2-offload.nu --self-test
          ./scripts/check-argon2-offload.nu

      - name: Check scripts/ stays Nushell
        # The guards above are Nushell (BUNYIP-490). Nothing else stops a
        # contributor adding a .sh back, so gate the extension and the shebang.
        run: ./scripts/check-no-bash.nu

      - name: Check the scrollbar contract
        # Thumb-only 14px webkit bars, `scrollbar-*` in the Firefox block only, and the app.js
        # idle hold (BUNYIP-848); --self-test first so a blind gate cannot pass vacuously.
        run: |
          ./scripts/check-scrollbars.nu --self-test
          ./scripts/check-scrollbars.nu

      - name: Check the committed Tailwind output is current
        # bunyip-web/assets/styles.css is committed and served as-is, so a
        # missed rebuild ships a stylesheet thinner than the markup needs and
        # nothing reports it. Rebuild to a temporary path and compare byte for
        # byte, and check every crates/*/src that emits markup is named by an
        # `@source` line in input.css (BUNYIP-598). Uses the runner's bun, else
        # the rust-builder-glibc image; it never installs a toolchain.
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-css-current.nu --self-test
          ./scripts/check-css-current.nu

      - name: Check user-facing copy stays on one glyph and one voice
        # No three-dot ellipsis, no emoticon and no internal issue key in any
        # string literal under bunyip-web/src: the ellipsis is the
        # single-character glyph everywhere (BUNYIP-472, closed for copy in
        # BUNYIP-551), the empty states are terse noun phrases, and a tracker id
        # stays in the code and its comments rather than on screen (BUNYIP-624).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-ui-copy.nu --self-test
          ./scripts/check-ui-copy.nu

      - name: Check no price or deadline is compiled into bunyip-web
        # A price is the tier's Stripe amount and a dunning deadline is the
        # member's grace_period_end, so neither is a literal: no price per
        # period and no `within N days` in any string literal under
        # bunyip-web/src, and every legitimate non-copy occurrence carries a
        # `// price-literal-ok:` reason (BUNYIP-590).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-price-literals.nu --self-test
          ./scripts/check-price-literals.nu

      - name: Check the em-dash ban
        # CLAUDE.md bans the em-dash (U+2014) in any output or artifact, so no
        # tracked file may contain one (BUNYIP-694). --self-test first, so a
        # gate that stopped detecting anything fails the build instead of
        # passing vacuously.
        run: |
          ./scripts/check-em-dash.nu --self-test
          ./scripts/check-em-dash.nu

      - name: Check no product name is compiled into bunyip-web
        # The brand is an admin-managed database record, not a literal: no
        # standalone `Bunyip` in bunyip-web/src/{views,handlers,skin}, and every
        # legitimate non-copy occurrence carries a `// brand-literal-ok:` reason
        # (BUNYIP-561).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-brand-literals.nu --self-test
          ./scripts/check-brand-literals.nu

      - name: Check every surface is painted from the theme tokens
        # No unmapped stock Tailwind scale in the client-side scripts (the toast
        # pills were emerald / red / slate, the only surfaces that ignored dark
        # and high-contrast) and no colour literal in the framework shell (the
        # two `theme-color` metas were hex, so a skin left the browser chrome
        # bunyip reed-green) - BUNYIP-549.
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-theme-colors.nu --self-test
          ./scripts/check-theme-colors.nu

      - name: Check docs/configuration.md matches its source-of-truth constants
        # ENV_INVENTORY and GovernedSecret::ALL (crates/bunyip-domain/src/config.rs)
        # and SYSTEM_LEVEL_ENV_KEYS (crates/bunyip-domain/src/sys_config.rs) are
        # hand-written copies of docs/configuration.md's tables, and nothing
        # compared them: five consecutive doc-drift audits found the doc's
        # "machine-generated" claim unchanged while the gap widened (BUNYIP-783,
        # absorbing BUNYIP-734's system-level-only check). --self-test first, so
        # a gate that stopped detecting anything fails the build instead of
        # passing vacuously.
        run: |
          ./scripts/check-doc-surface.nu --self-test
          ./scripts/check-doc-surface.nu

      - name: Check CLAUDE.md stays an index over docs/invariants
        # CLAUDE.md loads into every agent session, so each convention is one
        # index line there and its full text lives in docs/invariants/. Fails
        # over 20,000 bytes, on an unfenced line over 400 characters, or on a
        # docs/ link or anchor that does not resolve (BUNYIP-854).
        run: |
          ./scripts/check-claude-md.nu --self-test
          ./scripts/check-claude-md.nu

      - name: Check buildkit cache mounts are per-image and locked
        # Every `--mount=type=cache` carries an `id=` and `sharing=locked`, so
        # the concurrent builds of a release commit (main push plus tag push,
        # sharing one buildkit) cannot unpack crates into the same registry
        # directory and fail with `.cargo-ok: File exists` (BUNYIP-534).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-cache-mount-sharing.nu --self-test
          ./scripts/check-cache-mount-sharing.nu

      - name: Check volatile build metadata stays below the cached layers
        # A RUN's buildkit cache key includes its exec environment, so an `ENV`
        # carrying a per-build value (BUILD_DATE, GIT_COMMIT) above the
        # cargo-chef cook makes that layer uncacheable on every single build.
        # Measured: the cook was DONE, never CACHED, on 20 of 20 API runs, 68%
        # of the build (BUNYIP-519).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-build-cache-keys.nu --self-test
          ./scripts/check-build-cache-keys.nu

      - name: Check the publish workflows fire on the same pushes
        # bunyip-api:latest and bunyip-web:latest are read as a matched pair, so
        # both build workflows declare one shared `paths:` filter and the e2e
        # deploy gate replays it. When the lists drifted the pair named different
        # commits on 63% of merges (BUNYIP-519).
        # --self-test first, so a gate that stopped detecting anything fails the
        # build instead of passing vacuously.
        run: |
          ./scripts/check-publish-triggers.nu --self-test
          ./scripts/check-publish-triggers.nu

      - name: Report job metrics
        # Last and always(), so a failing job still reports (composite actions have no post hook).
        if: always()
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/job-metrics-report@main

  secrets:
    # Base image, medium size: the scanners read the tree and compile nothing, so
    # the dev image's C toolchain is not needed (BUNYIP-786).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    # A reusable-workflow caller cannot carry `defaults`, so the shared composite
    # runs as steps of this job and each scanner reports as its own step.
    defaults:
      run:
        shell: nu {0}
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets scan
        uses: https://dev.a8n.run/psa-systems/common/.forgejo/actions/check-secrets@main
        with:
          # Test fixtures and dev defaults only; Nosey Parker's list is
          # .noseyparker-ignore.txt. History findings are reported by git
          # object path, so they need the value regex (`kingfisher_excludes`
          # is a working-tree-only filter and does not reach a blob that
          # ever appeared in history, per the check-secrets action doc).
          # BUNYIP-864: the OIDC provider's test module carries a known
          # synthetic Ed25519 keypair for the logout-token JWKS round-trip
          # test, copied from dunite-oidc's own tests (DUNITE-29). The
          # unique base64 blob `MC4CAQA...sNtVKR` is the whole private key
          # material; matching it as a substring (unanchored, outside the
          # anchored short-token group) suppresses the finding wherever it
          # appears in history. Production code loads keys only through
          # `OidcKeySet` from disk; `grep "BEGIN PRIVATE"` on the file
          # returns the one test fixture and nothing else.
          kingfisher_skip_regex: '(^(\(\$pg_pass\)|CHANGE_ME|devpassword|nobody|pw|[rs]k_live_abcdefgh1234|rk_test_abcdefgh5678|sk_live_MIDDLE[s]ecretMATERIAL1234)$|MC4CAQAwBQYDK2VwBCIEIJ5gHv/Vi3V0Lk0k3jHN10sqRZ68P8fkNuLnF\+sNtVKR)'
