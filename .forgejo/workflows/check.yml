---

# Check: formatting, clippy, build, and unit tests on every push / PR.
# Runs on the runner host (not in Docker) so the cargo cache is reused between
# runs. bunyip-oidc has the only compile-time sqlx::query! macros; SQLX_OFFLINE
# resolves them against the committed .sqlx cache, so no database is needed. The
# generic dunite-core kernel is an anonymously-readable Forgejo git dependency
# (network only, no credentials).
name: Check

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "bunyip-api/**"
      - "bunyip-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".sqlx/**"
      - "scripts/**"
      - ".forgejo/workflows/check.yml"

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_LATEST }}
    env:
      SQLX_OFFLINE: "true"
      # Disk-footprint controls. CI doesn't need full DWARF debug info -
      # nothing here runs a debugger - and `-C debuginfo=2` (cargo's dev
      # default) bloats `target/` past 10GB per workspace. `line-tables-only`
      # keeps enough info for readable test panics and rustc backtraces while
      # cutting the on-disk size ~50%. Combined with disabling incremental
      # (which builds a separate per-job dep tree that gets thrown away on
      # the next runner allocation anyway), this keeps the runner's
      # /workspace from filling up between consecutive PR jobs - the
      # ENOSPC failures we hit on three back-to-back bunyip-upgrade PRs
      # were all this. See docs/bunyip-upgrade/00-overview.md for the
      # surrounding context.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5

      - name: Check migration version numbers
        # Unique + strictly increasing migration versions; blocks the suffix
        # collisions that parallel branches reintroduce (BUNYIP-79).
        run: ./scripts/check-migration-versions.sh

      - name: Install Rust toolchain components
        run: rustup component add clippy rustfmt

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify Cargo.lock is in sync
        # --locked errors if the lockfile would need updating, catching a
        # manifest bump (e.g. a release) that forgot to sync Cargo.lock
        # (BUNYIP-59).
        run: cargo build --workspace --all-targets --locked

      - name: Unit tests
        run: cargo test --workspace --lib
