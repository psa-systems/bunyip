---

# Check: formatting, clippy, build, and unit tests on every push / PR.
# Runs on the runner host (not in Docker) so the cargo cache is reused between
# runs. bunyip-oidc has the only compile-time sqlx::query! macros; SQLX_OFFLINE
# resolves them against the committed .sqlx cache, so no database is needed. The
# generic dunite-core kernel is an anonymously-readable Forgejo git dependency
# (network only, no credentials).

# Validate code on every push and pull request by running 'just check'
# Mirrors the local `just check` + `just test` recipes (which use ./dev/cargo).
name: Check

on:
  push:
    branches:
      - main
    paths:
      - "bunyip-api/**"
      - "bunyip-web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".sqlx/**"
      - "scripts/**"
      # All workflows, not just this one: the secret-scope gate below reads
      # e2e.yml / e2e-pr.yml (BUNYIP-425).
      - ".forgejo/workflows/**"

  pull_request:
    branches:
      - main

jobs:
  check:
    name: fmt + clippy + build + tests
    # Dev label: this job compiles Rust natively on the runner, and only the dev
    # image carries the C toolchain (cc/gcc/ld) plus the OpenSSL headers that
    # crate build scripts need. On the base label it fails with
    # `linker cc not found` (BUNYIP-444, #CLAUDE-203).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}
    env:
      SQLX_OFFLINE: "true"
      # Disk-footprint controls. CI doesn't need full DWARF debug info -
      # nothing here runs a debugger - and `-C debuginfo=2` (cargo's dev
      # default) bloats `target/` past 10GB per workspace. `line-tables-only`
      # keeps enough info for readable test panics and rustc backtraces while
      # cutting the on-disk size ~50%. Combined with disabling incremental
      # (which builds a separate per-job dep tree that gets thrown away on
      # the next runner allocation anyway), this keeps the runner's
      # /workspace from filling up between consecutive PR jobs - the
      # ENOSPC failures we hit on three back-to-back bunyip-upgrade PRs
      # were all this. See docs/bunyip-upgrade/00-overview.md for the
      # surrounding context.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_INCREMENTAL: "0"

    # Every run: step in this repo executes under Nushell (BUNYIP-489).
    # Declared once per job so a new step cannot silently inherit Bash;
    # scripts/check-workflow-shell.nu gates it.
    defaults:
      run:
        shell: nu {0}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the migration-immutability gate can diff against the
          # merge-base with origin/main (BUNYIP-293).
          fetch-depth: 0

      - name: Check migration version numbers
        # Unique + strictly increasing migration versions; blocks the suffix
        # collisions that parallel branches reintroduce (BUNYIP-79).
        run: ./scripts/check-migration-versions.nu

      - name: Check migration immutability
        # Reject edits/renames/deletes of already-committed migrations; sqlx
        # checksums applied migrations and a deployed DB refuses to boot if one
        # changes. Add a new migration instead (BUNYIP-293).
        run: ./scripts/check-migration-immutability.nu

      - name: Check PR-triggered workflows hold no credentials
        # A pull_request run executes the PR head's workflow, lifecycle scripts
        # and specs, so any secret it can read leaks to anyone who can push a
        # branch. Keeps the E2E suite off pull_request and the PR gate down to
        # the two base URLs (BUNYIP-425).
        run: ./scripts/check-workflow-secrets.nu

      - name: Check every workflow step runs under Nushell
        # Every job declares `defaults.run.shell: nu {0}` and no step opts back
        # into another shell, so a new step cannot silently inherit Bash
        # (BUNYIP-489). --self-test first, so a gate that stopped detecting
        # anything fails the build instead of passing vacuously.
        run: |
          ./scripts/check-workflow-shell.nu --self-test
          ./scripts/check-workflow-shell.nu

      - name: Check runner labels
        # Keep the native cargo job on the dev image (the only one with a C
        # toolchain), keep every label annotated, and keep the run-time
        # toolchain install from creeping back (BUNYIP-444).
        run: ./scripts/check-runner-labels.nu

      - name: Check security invariants
        # Grep-assert the shapes the BUNYIP-426 audit sweep removed: cookie
        # Secure derived from the transport, dunite pinned by rev, no signup
        # enumeration oracle, base images pinned by digest. None of these fails
        # a compile, so they need an explicit gate.
        run: ./scripts/check-security-invariants.nu

      - name: Check Stripe config stays DB-only
        # No STRIPE_* env surface outside the e2e harness. An env read compiles
        # fine but reinstates the "container env overrides the admin" behaviour
        # removed in BUNYIP-482.
        run: ./scripts/check-no-stripe-env.nu

      - name: Check the at-rest key stays single
        # No retired per-consumer encryption-key env names: TOTP, Stripe and
        # SMTP secrets are all protected by APP_ENCRYPTION_KEY (BUNYIP-483).
        run: ./scripts/check-no-legacy-key-env.nu

      - name: Check scripts/ stays Nushell
        # The guards above are Nushell (BUNYIP-490). Nothing else stops a
        # contributor adding a .sh back, so gate the extension and the shebang.
        run: ./scripts/check-no-bash.nu

      - name: Check the Infisical secret map
        # Re-derives the sync table from compose.yml and exercises the write
        # rules (0400, atomic, no-op re-run, no value ever printed), so a new
        # compose secret or a loosened write fails here (BUNYIP-504).
        run: ./scripts/sync-secrets.nu --self-test

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: $"CARGO_BUILD_JOBS=((sys cpu | length) / 2 | into int)\n" | save --append $env.GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify Cargo.lock is in sync
        # --locked errors if the lockfile would need updating, catching a
        # manifest bump (e.g. a release) that forgot to sync Cargo.lock
        # (BUNYIP-59).
        run: cargo build --workspace --all-targets --locked

      - name: Unit tests
        # --all-targets (not --lib) so binary-crate tests run too: bunyip-web
        # is a bin-only crate, and `--lib` silently skips its entire test suite
        # (BUNYIP-271). The registration-form field-error guards live there.
        run: cargo test --workspace --all-targets

      - name: Docker builder stage
        # Build the api image's builder stage only - catches Docker-build drift
        # cheaply, mirroring `just check-docker`. The runner reuses its image
        # store between jobs, and buildkit's exporter refuses to overwrite an
        # existing tag ("image ... already exists", BUNYIP-231). Drop any
        # builder image a prior run left behind so the rebuild can re-tag;
        # piping through `complete` captures the exit code and stderr instead
        # of raising, so the first run (tag absent) stays green, matching the
        # `docker image rm` cleanup in the justfile's `dev-clean-all` recipe.
        #
        # BUNYIP-241: buildkit's default-on provenance / SBOM attestation makes
        # the exporter emit BOTH an image manifest AND an attestation manifest
        # list and name both under the requested tag, which collides inside a
        # single run ("image already exists" after `naming to ... done`). The
        # check step does not consume the resulting image (it only validates
        # that the build succeeds), so `--provenance=false` collapses the
        # export to one manifest with no observable downside.
        #
        # Nushell has no backslash line continuation, so the build stays on one
        # line.
        run: |
          ^docker image rm bunyip-api-builder:check | complete | ignore
          ^docker build --provenance=false --file bunyip-api/oci-build/Dockerfile --target builder --tag bunyip-api-builder:check .
