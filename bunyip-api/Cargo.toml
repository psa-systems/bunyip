[package]
name = "bunyip-api"
description = "Backend API for Bunyip (PSA Systems)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# The crate ships a second binary (bunyip-e2e-bootstrap), which makes a bare
# `cargo run -p bunyip-api` ambiguous (and breaks `just dev` / the dev
# container's `cargo watch -x 'run -p bunyip-api'`). Pin the server as the
# default so `cargo run` resolves to it.
default-run = "bunyip-api"

[lints]
workspace = true

[[bin]]
name = "bunyip-api"
path = "src/main.rs"

# E2E test-account seeder (BUNYIP-52). Standalone tool, not a server subcommand;
# reuses the bunyip-api lib (config, repositories, services).
[[bin]]
name = "bunyip-e2e-bootstrap"
path = "src/bin/bunyip_e2e_bootstrap.rs"

# File-driven seed loader (PSA-50). Loads/resets a canonical seed JSON through
# the domain repositories; reuses the bunyip-api lib.
[[bin]]
name = "seed"
path = "src/bin/seed.rs"

# Deterministic generator for the demo-msp seed template (PSA-51). Emits JSON
# only; never touches a database.
[[bin]]
name = "gen-demo-seed"
path = "src/bin/gen_demo_seed.rs"

# bunyip owns the domain (bunyip-domain) and the verticals (bunyip-oci,
# bunyip-oidc). The generic kernel comes from dunite-core, which bunyip-domain
# pulls from the dunite framework repo on Forgejo.
[dependencies]
bunyip-domain = { path = "../crates/bunyip-domain" }
bunyip-oci = { path = "../crates/bunyip-oci" }
bunyip-oidc = { path = "../crates/bunyip-oidc" }

# BUNYIP-356: the Mokosh backup adapter implements the async AppBackupAdapter
# trait (defined in bunyip-domain with #[async_trait]).
async-trait = "0.1"

# Web framework.
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
actix-multipart = "0.7"
futures-util = "0.3"
# BUNYIP-145: SSE streaming uses BroadcastStream + IntervalStream wrappers
# around `tokio::sync::broadcast::Receiver` and `tokio::time::Interval`.
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / logging.
dotenvy = "0.15"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Errors.
thiserror = "1"
anyhow = "1"

# Auth / crypto / encoding.
jsonwebtoken = "9"
base64 = "0.21"
bytes = "1"
ipnetwork = "0.20"

# HTTP client / IO. rustls (not native-tls) so the static musl Alpine build
# needs no OpenSSL at runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tempfile = "3"
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Update-check polling cache.
parking_lot = "0.12"

# Database.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }

# Billing.
async-stripe = { version = "0.37", features = ["runtime-tokio-hyper", "checkout", "billing", "webhook-events"] }

# Attachment-upload security (BUNYIP-90). Both are tiny, zero-/few-dep
# crates that read only the header bytes of a file - no decoder, no
# decompression. `infer` sniffs the magic bytes to identify the file
# type; `imagesize` reads image dimensions without decoding the pixels,
# which is the cheap defence against decompression bombs.
infer = "0.16"
imagesize = "0.13"

[dev-dependencies]
actix-rt = "2"
wiremock = "0.6"
# BUNYIP-428: tests/totp_single_use.rs mints real TOTP codes for the step it
# wants to submit.
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
data-encoding = "2"
