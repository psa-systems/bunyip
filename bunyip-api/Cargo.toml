[package]
name = "bunyip-api"
description = "Thin Axum backend for Bunyip's MVP - serves the Dioxus SPA and mock JSON endpoints. Replaced by Mokosh Server post-MVP."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bunyip-api"
path = "src/main.rs"

[dependencies]
bunyip-mocks = { path = "../crates/bunyip-mocks" }

axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
tower-cookies = { version = "0.11", features = ["signed"] }

tokio.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
rand.workspace = true
validator.workspace = true

dotenvy = "0.15"

# Update-check polling. rustls (not native-tls) so the static musl
# Alpine build needs no OpenSSL at runtime.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
