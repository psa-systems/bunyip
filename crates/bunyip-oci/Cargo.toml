[package]
name = "bunyip-oci"
description = "OCI registry vertical for Bunyip (PSA Systems). Builds on bunyip-core; wires the generic, storage-agnostic dunite-oci engine to Bunyip's database + actix-web handlers/routes. (Port in progress - mirrors menkent-oci.)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bunyip-core = { path = "../bunyip-core" }
# Generic read-through OCI registry engine (consumer provides store traits + HTTP wiring).
dunite-oci = { git = "https://dev.a8n.run/psa-systems/dunite", branch = "main" }
