[package]
name = "bunyip-oci"
description = "OCI registry vertical for Bunyip (PSA Systems). Builds on bunyip-domain; wires the generic, storage-agnostic dunite-oci engine to Bunyip's database + actix-web handlers/routes. (Port in progress - mirrors menkent-oci.)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bunyip-domain = { path = "../bunyip-domain" }
# Generic read-through OCI registry engine (consumer provides store traits + HTTP wiring).
# Wave 1 bump: 8617fc8 adds `errors::context::{OciErrorContext, internal_fault}`
# (DUNITE-19) and `middleware::WwwAuthenticate` (DUNITE-21), both of which this
# crate used to carry locally. The local copies come out below.
dunite-oci = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "a831b6a01fecf1ad0d5e1dde0f6eba1f04a60679" }

actix-web = "4.18.1"
async-trait = "0.1.92"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
base64 = "0.23.1"
hex = "0.4.3"
ipnetwork = "0.21.1"
sha2 = "0.11.1"
bytes = "1.12.1"
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio = { version = "1.54.1", features = ["full", "signal"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2.15.0"
wiremock = "0.6.5"
tempfile = "3.27.0"
