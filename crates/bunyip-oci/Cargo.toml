[package]
name = "bunyip-oci"
description = "OCI registry vertical for Bunyip (PSA Systems). Builds on bunyip-domain; wires the generic, storage-agnostic dunite-oci engine to Bunyip's database + actix-web handlers/routes. (Port in progress - mirrors menkent-oci.)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bunyip-domain = { path = "../bunyip-domain" }
# Generic read-through OCI registry engine (consumer provides store traits + HTTP wiring).
dunite-oci = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "70eea0b5ab5452d2cde61ddf4ac36a27d33ee88f" }

actix-web = "4"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = "0.21"
hex = "0.4"
ipnetwork = "0.20"
sha2 = "0.10"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio = { version = "1", features = ["full", "signal"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2"
wiremock = "0.6"
tempfile = "3"
