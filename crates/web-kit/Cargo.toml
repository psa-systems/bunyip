[package]
name = "web-kit"
description = "Branding-free shared SSR web-kit (Maud + htmx building blocks) for PSA Systems front-ends."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
maud = "0.27.0"
axum = { version = "0.8.9", features = ["macros"] }
url = "2.5.8"
tracing = { workspace = true }
# BUNYIP-589: the client-IP forwarding middleware.
ipnetwork = "0.21.1"
tower = { version = "0.5.3", features = ["util"] }
tokio = { workspace = true }

# Mirrors bunyip-web: the toolkit exposes a wider surface than any single
# consumer wires up, so pub-but-unused helpers must not fail the build.
[lints.rust]
dead_code = "allow"

[lints.clippy]
too_many_arguments = "allow"
