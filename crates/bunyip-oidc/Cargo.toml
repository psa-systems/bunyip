[package]
name = "bunyip-oidc"
description = "OIDC / OAuth 2.1 provider vertical for Bunyip (PSA Systems) - Bunyip is the OpenID Provider; mokosh-server and other relying parties are clients. Builds on bunyip-domain; wires the generic dunite-oidc key/JWKS engine plus Bunyip's own provider handlers/persistence. Holds the compile-time sqlx::query! macros (offline cache in .sqlx/). (Port in progress - mirrors menkent-oidc.)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bunyip-domain = { path = "../bunyip-domain" }
# Generic OIDC key/JWKS helpers (Ed25519 PEM loading + JWKS publishing).
# Wave 1 bump: moves with dunite-core so the whole graph pins one rev and
# `dunite_oidc` + `dunite_core` + `dunite_oci` all share the same AppError.
dunite-oidc = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "10e90faf9c7c4dbc0142bbc49d2a287f9940958d" }

actix-web = "4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
base64 = "0.21"
urlencoding = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
actix-rt = "2"
