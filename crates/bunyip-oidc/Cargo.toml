[package]
name = "bunyip-oidc"
description = "OIDC / OAuth 2.1 provider vertical for Bunyip (PSA Systems) - Bunyip is the OpenID Provider; mokosh-server and other relying parties are clients. Builds on bunyip-core; wires the generic dunite-oidc key/JWKS engine plus Bunyip's own provider handlers/persistence. Holds the compile-time sqlx::query! macros (offline cache in .sqlx/). (Port in progress - mirrors menkent-oidc.)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bunyip-core = { path = "../bunyip-core" }
# Generic OIDC key/JWKS helpers (Ed25519 PEM loading + JWKS publishing).
dunite-oidc = { path = "../../../dunite/crates/dunite-oidc" }
