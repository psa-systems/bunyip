[package]
name = "bunyip-domain"
description = "Bunyip (PSA Systems) core domain layer: config, models, repositories, business services, and domain middleware (auth, auto-ban). Builds on the generic dunite-core kernel (errors, responses, validation, request-id/security-headers middleware, encryption/password/JWT-config services), re-exported under their original module names so domain sources keep using crate::errors, crate::responses, crate::services::{jwt,password,encryption}, etc."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Generic kernel (errors, responses, validation, middleware, primitive services).
# Pinned by rev, not branch, so a dunite bump is an explicit reviewable diff
# instead of whatever `main` happened to point at when the lock was refreshed
# (BUNYIP-426 F6). dunite publishes no tags; switch to `tag` when it does.
# DEV-526/529: dunite-core and its dependents (download/oci/oidc) are at 82f9baa
# for the CSRF guard, the error-log ring, and the trusted-proxy client-IP
# resolver in dunite-core; they move as one rev to keep a single dunite-core.
# The leaf crates below (stripe*, feedback, user-core, geoip, ipenrich, and
# hibp/webhook) are independent and pin separately.
dunite-core = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "82f9baa96c61e682269d9ff43c8042cb6882f5d1" }
# Generic Forgejo binary-distribution engine (artifact metadata, asset cache,
# rate limiting). Bunyip implements its store traits over Postgres.
dunite-download = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "82f9baa96c61e682269d9ff43c8042cb6882f5d1" }
# Shared Stripe primitives (DEV-495 / DEV-514): the constant-time webhook
# signature verifier, shared with a8n-tools and mokosh. Pinned to the branch rev
# that introduced the crate; the dunite-core/download pins stay at c5730bc since
# dunite main advanced dunite-oidc in between (unrelated). Collapse all three to
# the single merged rev once dunite PR #27 lands.
dunite-stripe-core = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# Shared feedback domain (DEV-495 / DEV-516): models + FeedbackRepository, lifted
# from this crate's own superset into dunite so a8n-tools can share it. Pinned to
# the branch rev that introduced the crate. The dunite pins collapse to one
# merged rev in a follow-up.
dunite-feedback = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# Shared Stripe service layer (DEV-495 / DEV-515). This slice provides the
# async-stripe response DTOs, re-exported from this crate's models; the service
# + runtime config land in a follow-up. Pinned to the branch rev that added it.
dunite-stripe = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# Shared account vocabulary (DEV-495 / DEV-517): the role / membership-status /
# subscription-tier enums and the tier-settings response, re-exported from this
# crate's models. The User row + repository stay here (a8n's schema has not
# caught up) and nothing in the crate derives FromRow (a8n is on sqlx 0.7).
# Pinned to the branch rev that introduced it.
dunite-user-core = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# DEV-531: the login-location signal (IP2Location lookup, the non-public-address
# filter, the record/unchanged/alert branch) extracted from this crate in
# DEV-525 and shared with a8n-tools.
dunite-geoip = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# BUNYIP-437: the ASN / VPN enrichment counterpart to dunite-geoip. Reads an
# IP2Proxy PX .BIN (address -> ASN, owning org, network category, VPN/proxy
# likelihood); advisory only, never a spam verdict. Same offline, leaf, owns-its-
# error contract as dunite-geoip.
dunite-ipenrich = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "ae62c276ab187852578daad1c4b9c823579b194a" }
# DEV-527: the HIBP k-anonymity password-breach check and the outbound
# HMAC-signed webhook sender, extracted from this crate's services. Leaf crates
# (own their types, no dunite-core dep), so they pin independently of the
# dunite-core graph rev.
dunite-hibp = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "82f9baa96c61e682269d9ff43c8042cb6882f5d1" }
dunite-webhook = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "82f9baa96c61e682269d9ff43c8042cb6882f5d1" }
# DEV-528: the in-process event bus + SSE framing (generic over the event type),
# extracted from services/event_bus.rs + handlers/events.rs. Leaf crate.
dunite-events = { git = "https://dev.a8n.run/psa-systems/dunite", rev = "1f536a2fa32b4db3df95945c444ee3ad7530fc57" }
async-trait = "0.1"

# Web framework + multipart.
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
futures-util = "0.3"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / logging.
dotenvy = "0.15"
tracing = "0.1"
tracing-actix-web = "0.7"

# Errors.
thiserror = "1"
anyhow = "1"

# Auth / crypto / encoding (JwtService + token hashing live here; the primitive
# encryption/password services come from dunite-core).
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
# Constant-time comparison of secret-derived material (BUNYIP-375 login-approval
# code check). Same crate bunyip-oidc uses for PKCE verification.
subtle = "2"
# BUNYIP-253: HIBP k-anonymity uses SHA-1 (it's the documented hash for
# the Pwned Passwords range query). Not used for any other purpose.
sha1 = "0.10"
base64 = "0.21"
ipnetwork = "0.20"
hmac = "0.12"
hex = "0.4"
data-encoding = "2"

# Templating + static init (email templates).
tera = "1"
lazy_static = "1.4"

# HTTP client / IO.
# (The Forgejo client, metadata/asset caches, and download limiter now come
# from dunite-download; reqwest/url stay for the webhook + Stripe services.)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
urlencoding = "2"
tokio = { version = "1", features = ["full", "signal"] }
bytes = "1"

# Database.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "ipnetwork", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.18", features = ["derive"] }

# Billing / 2FA / email.
async-stripe = { version = "0.37", features = ["runtime-tokio-hyper", "checkout", "billing", "webhook-events"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

[dev-dependencies]
actix-rt = "2"
wiremock = "0.6"
