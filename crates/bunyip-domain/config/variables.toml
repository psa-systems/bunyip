# Per-variable release facts the Rust `ENV_INVENTORY` cannot carry.
# `just config-docs` renders them into docs/configuration.md.
# `since` is the first release that shipped this variable; `required` means boot
# refuses when it is absent in production (either Required or RequiredInProduction).
#
# A variable the server no longer reads moves to [[removed]] with its original
# `since` and the release that dropped it; a Breaking change later than `since`
# is a [[change]] record naming the operator action and the originating issue.

