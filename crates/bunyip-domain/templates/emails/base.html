<!--
  BUNYIP-288: palette resolved from bunyip-web's dark-mode tokens in
  bunyip-web/input.css so the email visual matches the live dashboard the
  CTA lands on. HSL -> HEX resolution table (documented here so a future
  palette refresh has a greppable trail):

    --background:         hsl(120,  8%,  9%) -> #151915  (body)
    --card / bg elevated: hsl(120,  8%, 12%) -> #1c211c  (card)
    --foreground:         hsl(120, 21%, 96%) -> #f3f7f3  (near-white)
    --primary:            hsl(116, 28%, 31%) -> #395f39  (forest green)
    --primary bright:     hsl(116, 34%, 46%) -> #4d9a54  (gradient end / hover)
    --primary-foreground: hsl(  0,  0%,100%) -> #ffffff
    --muted-foreground:   hsl(113, 15%, 60%) -> #93a795  (footer, muted body)
    accent border:        primary at 20% alpha -> rgba(57, 95, 57, 0.20)

  Email clients cannot evaluate CSS variables; the palette is baked in as
  resolved HEX. Dark palette only: the live dashboard defaults to dark and a
  single confident palette renders more predictably across mail clients than
  a `prefers-color-scheme` swap (some clients render the dark CSS inside a
  light shell). Follow-up ticket can add light-mode support if user
  feedback warrants.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #cbd6cc;
      background-color: #151915;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .card {
      background: #1c211c;
      border-radius: 12px;
      border: 1px solid rgba(57, 95, 57, 0.20);
      overflow: hidden;
    }
    .header {
      background: #151915;
      border-bottom: 1px solid rgba(57, 95, 57, 0.24);
      padding: 24px;
      text-align: center;
    }
    .logo {
      text-decoration: none;
      font-size: 26px;
      line-height: 1;
    }
    .logo-brand {
      font-weight: 800;
      color: #f3f7f3;
    }
    .logo-tld {
      font-weight: 300;
      color: #93a795;
    }
    .content {
      padding: 32px;
    }
    h1 {
      color: #f3f7f3;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    h2 {
      color: #e5efe6;
    }
    p {
      color: #cbd6cc;
      margin: 0 0 16px;
    }
    .button {
      display: inline-block;
      background: #395f39;
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      margin: 16px 0;
    }
    .button-container {
      text-align: center;
      margin: 24px 0;
    }
    .muted {
      color: #93a795;
      font-size: 14px;
    }
    .link-fallback {
      color: #93a795;
      font-size: 12px;
      word-break: break-all;
    }
    .highlight {
      color: #4d9a54;
      font-weight: 600;
    }
    .footer {
      text-align: center;
      padding: 24px;
      color: #93a795;
      font-size: 14px;
    }
    .footer a {
      color: #4d9a54;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    ul {
      padding-left: 20px;
      margin: 16px 0;
    }
    li {
      color: #cbd6cc;
      margin-bottom: 8px;
    }
    strong {
      color: #f3f7f3;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(57, 95, 57, 0.18);
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <a href="{{ base_url }}" class="logo">
          <span class="logo-brand">{{ app_name }}</span>
        </a>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
    <div class="footer">
      <p>&copy; {{ year }} {{ app_name }}. All rights reserved.</p>
      <p>
        <a href="{{ base_url }}/privacy">Privacy Policy</a> |
        <a href="{{ base_url }}/terms">Terms of Service</a>
      </p>
    </div>
  </div>
</body>
</html>
