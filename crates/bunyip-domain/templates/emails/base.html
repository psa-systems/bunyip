<!--
  BUNYIP-569: layered dark email palette. Replaces the flat single-fill scheme
  from BUNYIP-288 that rendered as one near-black olive mass with green-on-green
  accents. Three distinct tones separate the layers so the card stands out, and
  green is reserved for accents and CTAs, never body copy. Baked HEX (mail
  clients cannot evaluate CSS variables):

    Outer page (darkest):      #0c0f0c  (+ subtle top gradient to #111710)
    Message card (raised):     #232b22
    Header band:               #1a211a
    Footer panel:              #141a13
    Card top accent strip:     #4d9a54  (3px)
    Body copy:                 #d4ddd4  (neutral light, not green)
    Headings / strong:         #f4f8f4
    Muted (footer, hints):     #95a596
    CTA button:                #3f6f3f -> #4d9a54 gradient, #ffffff text
    Accent / highlight / link: #74c47c  (bright green, reads on the raised card)
    Hairline borders:          primary green at low alpha, rgba(77,154,84, a)

  Dark only: one confident palette renders more predictably across mail clients
  than a prefers-color-scheme swap. Light mode is a follow-up if feedback warrants.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #d4ddd4;
      background-color: #0c0f0c;
      background-image: linear-gradient(180deg, #111710 0%, #0a0c0a 55%);
      margin: 0;
      padding: 0;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .card {
      background: #232b22;
      border-radius: 12px;
      border: 1px solid rgba(77, 154, 84, 0.22);
      border-top: 3px solid #4d9a54;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .header {
      background: #1a211a;
      border-bottom: 1px solid rgba(77, 154, 84, 0.24);
      padding: 24px;
      text-align: center;
    }
    .logo {
      text-decoration: none;
      font-size: 26px;
      line-height: 1;
    }
    .logo-brand {
      font-weight: 800;
      color: #f4f8f4;
    }
    .logo-tld {
      font-weight: 300;
      color: #95a596;
    }
    .content {
      padding: 32px;
    }
    h1 {
      color: #f4f8f4;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 16px;
    }
    h2 {
      color: #e8f0e9;
    }
    p {
      color: #d4ddd4;
      margin: 0 0 16px;
    }
    .button {
      display: inline-block;
      background-color: #3f6f3f;
      background-image: linear-gradient(135deg, #3f6f3f 0%, #4d9a54 100%);
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      margin: 16px 0;
    }
    .button-container {
      text-align: center;
      margin: 24px 0;
    }
    .muted {
      color: #95a596;
      font-size: 14px;
    }
    .link-fallback {
      color: #95a596;
      font-size: 12px;
      word-break: break-all;
    }
    .highlight {
      color: #74c47c;
      font-weight: 600;
    }
    .footer {
      background: #141a13;
      border-radius: 10px;
      text-align: center;
      margin-top: 20px;
      padding: 20px 24px;
      color: #95a596;
      font-size: 14px;
    }
    .footer a {
      color: #74c47c;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    ul {
      padding-left: 20px;
      margin: 16px 0;
    }
    li {
      color: #d4ddd4;
      margin-bottom: 8px;
    }
    strong {
      color: #f4f8f4;
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(77, 154, 84, 0.16);
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <a href="{{ base_url }}" class="logo">
          <span class="logo-brand">{{ app_name }}</span>
        </a>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
    <div class="footer">
      <p>&copy; {{ year }} {{ app_name }}. All rights reserved.</p>
      <p>
        <a href="{{ base_url }}/privacy">Privacy Policy</a> |
        <a href="{{ base_url }}/terms">Terms of Service</a>
      </p>
    </div>
  </div>
</body>
</html>
