# Configure Dioxus
# https://dioxuslabs.com/learn/0.7/guides/tools/configure

[application]
name = "bunyip-web"
default_platform = "web"

# Asset folder for static files (CSS, images). dx copies its contents into the
# build's public/ directory and resolves asset!() references.
asset_dir = "assets"

[web.app]
# dx 0.7 appends this to whatever is already in <title>. Empty string keeps
# the literal index.html title intact (we ship `<title>Bunyip · Surfaces what matters.</title>`).
title = ""

# Path to the custom index.html template. Without this dx generates its own,
# which lacks the splash, font preloading, and our title.
index_html = "index.html"

# CSS is included via asset!() in src/main.rs, not via the legacy style array.
[web.resource]

[web.resource.dev]

# No dev proxy: the SPA hits mokosh-server directly at the absolute issuer
# URL resolved at runtime from /config.json (see src/stores/config.rs).
# Bearer-token-on-fetch crosses origins; mokosh-server's CORS allow_origin(Any) accepts it.

[build]
target_dir = "target"
