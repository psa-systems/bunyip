[package]
name = "bunyip-web"
description = "Dioxus frontend for Bunyip - the SaaS / business platform UI for the Mokosh PSA product."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bunyip-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["router", "web"] }

serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true }
chrono = { workspace = true }
validator.workspace = true

# WASM-friendly randomness for client-side IDs
getrandom = { version = "0.3", features = ["wasm_js"] }

# HTTP client (wasm). Used for /v1/* API calls.
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "Storage", "Location", "Navigator", "MediaQueryList", "Url", "UrlSearchParams", "PageTransitionEvent", "RequestCredentials"] }

# Error trait (used by OIDC flow's FlowError)
thiserror = { workspace = true }

# OIDC code+PKCE primitives. rand 0.9 to match the getrandom 0.3 wasm
# story (rand 0.8 pulls getrandom 0.2 which needs separate feature
# config for the wasm32-unknown-unknown target).
base64 = "0.22"
sha2 = { workspace = true }
rand = "0.9"
