[package]
name = "bunyip-web"
description = "Axum SSR frontend for PSA Systems (Bunyip) - server-rendered HTML (Maud + htmx) backed by the separate /v1 API."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bunyip-web"
path = "src/main.rs"

[dependencies]
# Web server.
axum = { version = "0.7", features = ["macros"] }
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"] }

# HTML templating (compile-checked Rust macro) - rendered to String and wrapped
# in axum::response::Html, so no version coupling with a maud "axum" feature.
maud = "0.26"

# Server-side HTTP client for the /v1 API. rustls to avoid a native OpenSSL dep.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Server-side QR rendering (otpauth URI -> inline SVG) for 2FA setup.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Logging.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Release/dev profiles are defined once at the workspace root (../Cargo.toml).
