<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bunyip - the SaaS layer for your PSA. Auth, billing, members, and identity for Mokosh.">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f4e2e">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161a16">

    <title>Bunyip · Surfaces what matters.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- styles.css is injected at runtime by Dioxus (document::Stylesheet in src/main.rs). -->

    <!-- Resolve theme synchronously BEFORE the body paints to avoid a
         flash of unstyled light content on dark systems. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('bunyip-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {
                /* localStorage blocked - fall back to light */
            }
        })();
    </script>

    <style>
        /* Minimal body styling for the brief window before the WASM bundle boots
           and Dioxus replaces #bunyip-splash with the real app. The .dark
           overrides keep the splash matching the resolved theme. */
        html, body {
            margin: 0;
            padding: 0;
            background: #f3f7f3;
            color: #1f311f;
            font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        html.dark, html.dark body {
            background: #161a16;
            color: #f3f7f3;
        }
        #bunyip-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f7f3;
            font-size: 0.875rem;
            color: #2f4e2e;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 1;
            transition: opacity 200ms ease;
            z-index: 9999;
            pointer-events: none;
        }
        html.dark #bunyip-splash {
            background: #161a16;
            color: #99bb8e;
        }
        body[data-bunyip-ready] #bunyip-splash {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="bunyip-splash">Loading Bunyip…</div>
    <div id="main"></div>

    <script>
        (function () {
            var main = document.getElementById('main');
            if (!main) return;
            var observer = new MutationObserver(function () {
                if (main.children.length > 0) {
                    document.body.setAttribute('data-bunyip-ready', '');
                    observer.disconnect();
                    setTimeout(function () {
                        var splash = document.getElementById('bunyip-splash');
                        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    }, 300);
                }
            });
            observer.observe(main, { childList: true });
        })();
    </script>
</body>
</html>
