<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bunyip - the SaaS layer for your PSA. Auth, billing, members, and identity for Mokosh.">
    <meta name="theme-color" content="#2f4e2e">

    <title>Bunyip · Surfaces what matters.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- styles.css is injected at runtime by Dioxus (document::Stylesheet in src/main.rs). -->

    <style>
        /* Minimal body styling for the brief window before the WASM bundle boots
           and Dioxus replaces #bunyip-splash with the real app. */
        html, body {
            margin: 0;
            padding: 0;
            background: #f3f7f3;
            color: #1f311f;
            font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        #bunyip-splash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f7f3;
            font-size: 0.875rem;
            color: #2f4e2e;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            opacity: 1;
            transition: opacity 200ms ease;
            z-index: 9999;
            pointer-events: none;
        }
        /* When the Dioxus app has mounted at least one element inside #main, the
           "ready" attribute is added by the inline script below and the splash
           fades out. */
        body[data-bunyip-ready] #bunyip-splash {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="bunyip-splash">Loading Bunyip…</div>
    <div id="main"></div>

    <script>
        // Hide the splash as soon as Dioxus injects anything into #main.
        (function () {
            var main = document.getElementById('main');
            if (!main) return;
            var observer = new MutationObserver(function () {
                if (main.children.length > 0) {
                    document.body.setAttribute('data-bunyip-ready', '');
                    observer.disconnect();
                    setTimeout(function () {
                        var splash = document.getElementById('bunyip-splash');
                        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    }, 300);
                }
            });
            observer.observe(main, { childList: true });
        })();
    </script>
</body>
</html>
