# Publishes this repo's docs to docs.a8n.systems under /docs/bunyip.
source = "bunyip"
base_path = "/docs/bunyip"
include = ["README.md", "src/**/*.rs", "**/src/**/*.rs"]
exclude = ["CLAUDE.md", "docs/**", "common/**", "tests/**", "**/tests/**", "target/**", "**/target/**"]

[storefront]
url = "https://docs.a8n.systems"
site = "docs"
