# Pin the Rust toolchain so CI, local checks, and the rust-builder images all
# agree on one compiler. 1.94 matches the ghcr.io/niceguyit/rust-builder-*
# v1.0.0-rust1.94-* images used by the Dockerfiles and the container check
# workflow (see CLAUDE.md "Checks on toolchain-less dev boxes"). Bump this
# deliberately and fix any newly-promoted clippy/rustfmt lints in the same PR
# (BUNYIP-36 did exactly that for the 1.93 -> 1.94 move).
[toolchain]
channel = "1.94.1"
components = ["clippy", "rustfmt"]
